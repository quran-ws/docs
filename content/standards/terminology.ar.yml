# Editorial snapshot: 2026-09-13. IDs are strings and remain stable after reordering.
title: "معيار تسمية المفردات القرآنية"
description: "قواعد أسماء المفاهيم القرآنية وتهجئتها وتركيبها والتمييز بينها."
status: draft
order: 1
intro: |
  يحدد هذا المعيار أسماء المفاهيم القرآنية وطرق تكوينها وتهجئتها والتمييز بينها.

  تُعد أحكام هذا المعيار متطلبات للمطابقة، ما لم يُنص على أنها توصيات أو خيارات مسموحة. تُستخدم «يجب» للإلزام، و«يُوصى» للتوصية، و«يجوز» للسماح. التعريفات تشرح المعاني، والأمثلة توضح تطبيق الأحكام.

  هذه مسودة للمراجعة. لم تُحدَّث النسخة الإنجليزية بعد، وهي تمثل [النسخة السابقة](https://github.com/quran-ws/docs/blob/79e3c6bb2b52dd1df81b3e64debfebf9dd5f8ea5/content/en/reference/standard.md). والإحالات القديمة إلى الأقسام بعلامة § تخص [النسخة العربية السابقة](https://github.com/quran-ws/docs/blob/79e3c6bb2b52dd1df81b3e64debfebf9dd5f8ea5/content/ar/reference/standard.md).
rules:
  - id: "001"
    category: "الاسم المعتمد وتفرّده"
    name: "الاسم البرمجي المعتمد"
    description: >-
      يُعتمد اسم برمجي واحد لكل مفهوم، وتُستخدم مفرداته نفسها في المواضع التي تتبع المعيار قدر
      الإمكان.
    examples:
      - |
          | المفهوم | الاسم المعتمد | أسماء لا تحل محله |
          | --- | --- | --- |
          | السورة | `surah` | `chapter`، `quran_section` |
      - |
          يُستخدم الاسم المعتمد نفسه في المواضع التي تتبع المعيار.
  - id: "002"
    category: "الترجمة والأسماء المركبة"
    name: "نقل المصطلح المتخصص"
    description: >-
      يُحتفظ بالاسم العربي للمفهوم القرآني أو العلمي المتخصص ويُكتب بحروف لاتينية إذا كانت الترجمة
      العامة تفقده دقته أو هويته.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | سورة | `surah` |
          | آية | `ayah` |
          | تجويد | `tajwid` |
  - id: "003"
    category: "الترجمة والأسماء المركبة"
    name: "ترجمة المفهوم العام"
    description: >-
      يُستخدم الاسم الإنجليزي الطبيعي للمفهوم العام الذي له اسم تقني واضح.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | كلمة | `word` |
          | صفحة | `page` |
          | حرف | `letter` |
  - id: "004"
    category: "الترجمة والأسماء المركبة"
    name: "تكوين الاسم المركب"
    description: >-
      في الاسم المركب، يُنقل المصطلح الذي له أصل في القرآن أو علومه كاملًا بحروف لاتينية، وتُترجم
      الكلمات العامة المضافة إليه إلى الإنجليزية. يتحدد النقل أو الترجمة بمعنى الكلمة داخل
      المصطلح.
    examples:
      - |
          | الاسم العربي | الصيغة المعتمدة |
          | --- | --- |
          | الرَّسْم الإِمْلَائِيّ | `rasm_imlai` |
          | النُّون السَّاكِنَة | `noon_sakinah` |
          | الوَقْف اللَّازِم | `waqf_lazim` |
          | المِيم الصَّغِيرَة | `small_meem` |
      - |
          صيغة «المِيم الصَّغِيرَة» هي `small_meem`، وليست `meem_saghirah`.
  - id: "005"
    category: "الترجمة والأسماء المركبة"
    name: "ترتيب الصفة المترجمة"
    description: >-
      تسبق الصفة المترجمة إلى الإنجليزية الاسم الذي تصفه.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | الأَلِف المَحْذُوفَة | `omitted_alif` |
  - id: "006"
    category: "الترجمة والأسماء المركبة"
    name: "ترتيب المضافات المترجمة"
    description: >-
      يأتي الاسم العام المضاف في نهاية التركيب الإنجليزي، ويُعكس ترتيب المضافات المترجمة
      المتتابعة.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | عَلَامَة الوَقْف | `waqf_mark` |
          | نَوْع عَلَامَة الوَقْف | `waqf_mark_type` |
  - id: "007"
    category: "الترجمة والأسماء المركبة"
    name: "المعنى الاصطلاحي داخل المركب"
    description: >-
      تتحدد طريقة كتابة الكلمة بحسب معناها الاصطلاحي في التركيب: تُترجم «إملائية» مع «علامة»،
      وتُنقل بحروفها مع «رسم».
    examples:
      - |
          | الاسم العربي | الصيغة المعتمدة |
          | --- | --- |
          | العَلَامَة الإِمْلَائِيَّة | `orthographic_mark` |
          | الرَّسْم الإِمْلَائِيّ | `rasm_imlai` |
  - id: "008"
    category: "التهجئة: صيغة الاسم"
    name: "صيغة الاسم البرمجي"
    description: >-
      تُكتب الصورة المعتمدة للاسم البرمجي بحروف لاتينية صغيرة، وتُفصل كلمات الاسم المركب بشرطة
      سفلية: `snake_case`.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | نظام عد الآي | `ayah_numbering_system` |
          | الوقف اللازم | `waqf_lazim` |
  - id: "009"
    category: "التهجئة: الحروف والحركات"
    name: "محارف التهجئة البرمجية"
    description: >-
      يُكتب الاسم البرمجي بمحارف `ASCII`، من دون علامات النقل العلمي أو علامة اقتباس لتمثيل الهمزة
      والعين.
    examples:
      - |
          | الصيغة البرمجية المعتمدة | صيغة لا تُستخدم برمجيًا |
          | --- | --- |
          | `qiraah` | `qirāʾah` |
          | `irab` | `i'rab` |
  - id: "010"
    category: "التهجئة: الحروف والحركات"
    name: "أصل اشتقاق التهجئة"
    description: >-
      تُشتق تهجئة المصطلح العربي من اسمه المشكول وفق قواعد هذا المعيار.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | سُورَة | `surah` |
  - id: "011"
    category: "التهجئة: الحروف والحركات"
    name: "ضبط الاسم العربي بالحركات"
    description: >-
      يُعتمد الاسم العربي بالحركات عند اشتقاق تهجئته، وتُكتب همزة الوصل ألفًا عليها حركتها، ولا
      تُفترض حركة غير مذكورة.
    examples:
      - |
          | الاسم العربي بالحركات | الصيغة المشتقة |
          | --- | --- |
          | اِسْتِعَاذَة | `istiadhah` |
      - |
          «استعاذة» بلا حركات لا تكفي لتحديد التهجئة. تكتب اِ بدل ٱ.
  - id: "012"
    category: "التهجئة: الحروف والحركات"
    name: "استعادة الاسم العربي"
    description: >-
      لا يُعتمد على الاسم البرمجي لاستعادة حروف الاسم العربي الأصلية.
    examples:
      - |
          | الحرف العربي | المقابل اللاتيني |
          | --- | --- |
          | ص | `s` |
          | س | `s` |
      - |
          تُحفظ العربية الأصلية مستقلة؛ لا يحدد `s` وحده أي الحرفين كان في الاسم.
  - id: "013"
    category: "التهجئة: الحروف والحركات"
    name: "مقابلات الحروف الصامتة"
    description: >-
      تُنقل الحروف الصامتة وفق المقابلات الموضحة في المثال.
    examples:
      - |
          | الحرف العربي | المقابل اللاتيني |
          | --- | --- |
          | ب | `b` |
          | ت | `t` |
          | ث | `th` |
          | ج | `j` |
          | ح | `h` |
          | خ | `kh` |
          | د | `d` |
          | ذ | `dh` |
          | ر | `r` |
          | ز | `z` |
          | س | `s` |
          | ش | `sh` |
          | ص | `s` |
          | ض | `d` |
          | ط | `t` |
          | ظ | `z` |
          | غ | `gh` |
          | ف | `f` |
          | ق | `q` |
          | ك | `k` |
          | ل | `l` |
          | م | `m` |
          | ن | `n` |
          | ه | `h` |
          | و | `w` |
          | ي | `y` |
          | ة | `h` |
  - id: "014"
    category: "التهجئة: الحروف والحركات"
    name: "الحركات القصيرة"
    description: >-
      تُمثَّل الحركات القصيرة بالفتحة `a` والكسرة `i` والضمة `u`.
    examples:
      - |
          | الحركة | المقابل اللاتيني |
          | --- | --- |
          | الفتحة (َ) | `a` |
          | الكسرة (ِ) | `i` |
          | الضمة (ُ) | `u` |
  - id: "015"
    category: "التهجئة: الحروف والحركات"
    name: "صور الألف الطويلة"
    description: >-
      تُعامل الألف المقصورة والألف الخنجرية والمدة معاملة الألف الطويلة.
    examples:
      - |
          | الصورة العربية | المقابل اللاتيني |
          | --- | --- |
          | ا / ى / الألف الخنجرية / المدة | `a` |
  - id: "016"
    category: "التهجئة: الحروف والحركات"
    name: "حروف اللين"
    description: >-
      تُكتب الواو الساكنة بعد الفتحة `aw`، والياء الساكنة بعدها `ay`.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | مَوْضِع | `mawdi` |
          | أَوْلَى | `awla` |
          | طَرَفَيْن | `tarafayn` |
  - id: "017"
    category: "التهجئة: الحروف والحركات"
    name: "الحرف المشدد"
    description: >-
      يُضاعف الحرف الذي يحمل شدة في التهجئة البرمجية. وترد صيغة ياء النسب في [القاعدة
      022](#rule-022).
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | شَدَّة | `shaddah` |
          | مُقَطَّع | `muqatta` |
  - id: "018"
    category: "التهجئة: الحروف والحركات"
    name: "التنوين وحركة الإعراب"
    description: >-
      تُحفظ حركة التنوين القصيرة وحدها، وتُسقط حركة الإعراب في آخر الكلمة.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | هُدًى | `huda` |
  - id: "019"
    category: "التهجئة: التاء المربوطة"
    name: "التاء المربوطة خارج الإضافة"
    description: >-
      تُكتب التاء المربوطة `h` في آخر الاسم أو قبل الصفة، إذا لم تكن الكلمة مضافة إلى ما بعدها.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | سُورَة | `surah` |
          | القَلْقَلَة الصُّغْرَى | `qalqalah_sughra` |
  - id: "020"
    category: "التهجئة: التاء المربوطة"
    name: "التاء المربوطة في الإضافة"
    description: >-
      تُكتب التاء المربوطة `t` إذا كانت الكلمة مضافة إلى ما بعدها.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | هَمْزَة الوَصْل | `hamzat_al_wasl` |
          | سَجْدَة التِّلَاوَة | `sajdat_al_tilawah` |
  - id: "021"
    category: "التهجئة: المد وأسماء الحروف"
    name: "حروف المد"
    description: >-
      تُكتب حروف المد بحرف لاتيني واحد: `a` أو `i` أو `u`. ولأسماء الحروف تهجئات معتمدة في
      [القاعدة 023](#rule-023).
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | تَجْوِيد | `tajwid` |
          | تَفْسِير | `tafsir` |
          | نُزُول | `nuzul` |
  - id: "022"
    category: "التهجئة: المد وأسماء الحروف"
    name: "ياء النسب"
    description: >-
      تُكتب ياء النسب المشددة في نهاية الاسم `i` واحدة.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | مَكِّيّ | `makki` |
          | مَدَنِيّ | `madani` |
          | عُثْمَانِيّ | `uthmani` |
  - id: "023"
    category: "التهجئة: المد وأسماء الحروف"
    name: "تهجئات أسماء الحروف"
    description: >-
      تُستخدم تهجئات أسماء الحروف المسجلة في [جدول أسماء
      الحروف](https://github.com/quran-ws/docs/blob/79e3c6bb2b52dd1df81b3e64debfebf9dd5f8ea5/standards/terminology/data/letter_names.tsv#L13-L40)،
      سواء ورد اسم الحرف وحده أو داخل مركب.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | نُون | `noon` |
          | مِيم | `meem` |
          | سِين | `seen` |
          | جِيم | `jeem` |
          | يَاء | `yaa` |
          | صَاد | `saad` |
          | المِيم الصَّغِيرَة | `small_meem` |
          | سِين القِرَاءَة | `seen_al_qiraah` |
  - id: "024"
    category: "التهجئة: المد وأسماء الحروف"
    name: "التهجئة الشائعة والصورة المشتقة"
    description: >-
      إذا خالفت التهجئة الشائعة الصورة المشتقة، تُستخدم الشائعة للعرض وللبحث، وتبقى الصورة المشتقة
      اسمًا برمجيًا.
    examples:
      - |
          | صورة الاسم | التهجئة |
          | --- | --- |
          | الاسم البرمجي | `tajwid` |
          | اسم العرض | `Tajweed` |
          | تهجئة بديلة للبحث | `tajweed` |
  - id: "025"
    category: "التهجئة: الهمزة والعين والاستثناءات"
    name: "الهمزة والعين"
    description: >-
      يُحذف الحرف المقابل للهمزة والعين وعلاماتهما الخاصة، وتبقى حركتهما في وسط الكلمة.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | قِرَاءَة | `qiraah` |
          | مُعَلِّم | `muallim` |
  - id: "026"
    category: "التهجئة: الهمزة والعين والاستثناءات"
    name: "الهمزة والعين بعد ساكن في آخر الكلمة"
    description: >-
      تُكرَّر الحركة السابقة إذا انتهت الكلمة بهمزة أو عين يسبقهما حرف ساكن.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | رُبْع | `rubu` |
          | جَمْع | `jama` |
          | قَطْع | `qata` |
  - id: "027"
    category: "التهجئة: الهمزة والعين والاستثناءات"
    name: "استثناء التهجئة المستقرة"
    description: >-
      عند وجود استثناء موثق للمصطلح في جدول التهجئات المستقرة، تُستخدم التهجئة المستقرة المسجلة
      بدل الناتج المشتق. ولا يُضاف استثناء شيوع إلا بقياس يثبت أن الناتج المشتق نادر الاستعمال
      جدًا.
    examples:
      - |
          | الاسم العربي | التهجئة المستقرة المعتمدة | الناتج المشتق المستبدل |
          | --- | --- | --- |
          | الجزء | `juz` | `juzu` |
  - id: "028"
    category: "التهجئة: الهمزة والعين والاستثناءات"
    name: "اسم سورة آل عمران"
    description: >-
      يُكتب اسم سورة آل عمران `aal_imran` لتمييز آل عن أداة التعريف `al`.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | آل عِمْرَان | `aal_imran` |
  - id: "029"
    category: "التهجئة: الهمزة والعين والاستثناءات"
    name: "السور المسماة بحروفها الأولى"
    description: >-
      تُستخدم الأسماء المسجلة لسور طه ويس وص وق، وهي السور المسماة بالحروف التي تفتتح بها.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | طه | `taha` |
          | يس | `yasin` |
          | ص | `saad` |
          | ق | `qaaf` |
  - id: "030"
    category: "التهجئة: التعريف والروابط"
    name: "أداة التعريف والحروف الشمسية"
    description: >-
      عندما تبقى أداة التعريف داخل المركب، تُكتب `al` بصورة ثابتة، ولا تتغير بسبب الحروف الشمسية.
    examples:
      - |
          | الاسم العربي | الاسم البرمجي | اسم العرض |
          | --- | --- | --- |
          | أسباب النزول | `asbab_al_nuzul` | `Asbab al-Nuzul` |
  - id: "031"
    category: "التهجئة: التعريف والروابط"
    name: "أداة التعريف في أول الاسم"
    description: >-
      تُحذف أداة التعريف الواقعة في أول الاسم البرمجي.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | الفَتْحَة | `fathah` |
          | السُّكُون | `sukun` |
  - id: "032"
    category: "التهجئة: التعريف والروابط"
    name: "أداة التعريف في الصفة"
    description: >-
      تُحذف أداة التعريف من الصفة التي تتبع موصوفًا معرفًا.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | الرَّسْم العُثْمَانِيّ | `rasm_uthmani` |
          | الوَقْف اللَّازِم | `waqf_lazim` |
  - id: "033"
    category: "التهجئة: التعريف والروابط"
    name: "أداة التعريف في المضاف إليه"
    description: >-
      تبقى `al` في المضاف إليه، وتُحدَّد علاقة الإضافة أو الوصف بين كل كلمتين متجاورتين.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | رُبْع الحِزْب | `rubu_al_hizb` |
          | الوَقْف الجَائِز مُسْتَوِي الطَّرَفَيْن | `waqf_jaiz_mustawi_al_tarafayn` |
  - id: "034"
    category: "التهجئة: التعريف والروابط"
    name: "أداة التعريف بعد ترجمة المضاف"
    description: >-
      يُستبعد المضاف المترجم عند تحديد بقاء أداة التعريف في بقية الاسم.
    examples:
      - |
          | الاسم العربي | الصيغة المعتمدة | صيغة تخالف القاعدة |
          | --- | --- | --- |
          | عَلَامَة الوَقْف اللَّازِم | `waqf_lazim_mark` | `al_waqf_lazim_mark` |
  - id: "035"
    category: "التهجئة: التعريف والروابط"
    name: "حروف الجر المتصلة"
    description: >-
      عندما يتصل بِ أو لِ بالاسم داخل المصطلح، يُفصل حرف الجر في جزء مستقل من الاسم البرمجي، وتبقى
      أداة التعريف في الاسم المجرور.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | تَفْسِير بِالرَّأْي | `tafsir_bi_al_ray` |
          | المَدّ العَارِض لِلسُّكُون | `madd_arid_li_al_sukun` |
  - id: "036"
    category: "التهجئة: التعريف والروابط"
    name: "كلمات الربط"
    description: >-
      تُحذف مَعَ وكَوْن وبِحَيْثُ وجَوَازًا من الاسم البرمجي عندما تكون روابط بين أجزائه، ويبقى
      الاسم العربي كاملًا.
    examples:
      - |
          | الاسم العربي | الصيغة البرمجية |
          | --- | --- |
          | الوَقْف الجَائِز مَعَ كَوْنِ الوَصْل أَوْلَى | `waqf_jaiz_wasl_awla` |
  - id: "037"
    category: "صور الاسم"
    name: "ثبات الاسم البرمجي"
    description: >-
      يُستخدم الاسم البرمجي المعتمد كما هو، ولا يتغير لمجرد ظهور تهجئة أكثر شيوعًا.
    examples:
      - |
          | الاستخدام | الاسم |
          | --- | --- |
          | الاسم البرمجي الثابت | `tajwid` |
          | التهجئة الشائعة في العرض | `Tajweed` |
      - |
          يبقى `tajwid` اسمًا برمجيًا مع شيوع `Tajweed` في العرض.
  - id: "038"
    category: "صور الاسم"
    name: "اختيار اسم العرض"
    description: >-
      تُختار للعرض أمام القارئ التهجئة الإنجليزية الأكثر شيوعًا، ويُوثَّق دليل اختيارها. اسم العرض
      هو الاسم المقروء في الواجهات والتوثيق، وقد يختلف عن الاسم البرمجي.
    examples:
      - |
          | صورة الاسم | التهجئة |
          | --- | --- |
          | الاسم البرمجي | `tajwid` |
          | اسم العرض | `Tajweed` |
  - id: "039"
    category: "صور الاسم"
    name: "الاسم العربي المشكول"
    description: >-
      يُحتفظ بالاسم العربي المشكول للمصطلح القرآني أو العلمي العربي، ويُستخدم للاشتقاق وللعرض
      العربي.
    examples:
      - |
          | الاسم العربي | الاسم البرمجي |
          | --- | --- |
          | الهَمْزَة | `hamzah` |
  - id: "040"
    category: "صور الاسم"
    name: "تسمية المصدر والاسم المعياري"
    description: >-
      يُميَّز الاسم المعياري عن الاسم أو وصف الشكل الذي ورد في المصدر، وتُنقل تسمية المصدر كما
      وردت مع نسبتها إليه. ينطبق ذلك عند اختلاف اسم العلامة أو تصنيفها في المعيار عنه في علم الضبط
      أو مقدمة المصحف أو مصدر آخر.
    examples:
      - |
          | نوع التسمية | المثال |
          | --- | --- |
          | اسم من علم الضبط | المِيم — عَلَامَة الوَقْف اللَّازِم |
          | وصف شكل من المصدر | رَأْس عَيْن |
          | تصنيف المصدر | `imlaiyyah` |
          | اسم المعيار | `orthographic_mark` |
  - id: "041"
    category: "صور الاسم"
    name: "تغيير الاسم العربي"
    description: >-
      لا يُغيَّر الاسم العربي المشكول إلا لسبب لغوي يوضح المفهوم، ولا يُغيَّر للوصول إلى اسم برمجي
      مرغوب.
    examples:
      - |
          | الحالة | الاسم العربي |
          | --- | --- |
          | الاسم الكامل في المثال | الوَقْف الجَائِز مَعَ كَوْنِ الوَصْل أَوْلَى |
          | اختصار مقترح لمجرد تقصير الاسم البرمجي | الوَقْف الجَائِز |
      - |
          لا يُختصر الاسم العربي لقيمة الوقف لمجرد تقصير اسمها البرمجي. في هذا المثال، يحذف الاختصار بيان أن الوصل أولى.
  - id: "042"
    category: "صور الاسم"
    name: "تعريف الاسم العربي بأل"
    description: >-
      يُكتب الاسم العربي المفرد معرفًا بأل، وتُكتب قيمة التصنيف التي هي صفة دون أل.
    examples:
      - |
          | نوع الاسم | الصورة العربية |
          | --- | --- |
          | اسم مفرد معرف بأل | السُّورَة |
          | اسم مفرد معرف بأل | التَّجْوِيد |
          | قيمة تصنيف بصيغة الصفة | مَكِّيّ |
          | قيمة تصنيف بصيغة الصفة | مُرَتَّل |
  - id: "043"
    category: "صور الاسم"
    name: "اسم محرف يونيكود"
    description: >-
      يُنقل الاسم الرسمي لمحرف يونيكود كما هو، ولا يُستخدم اسمًا برمجيًا للمفهوم الذي يمثله
      المحرف.
    examples:
      - |
          | نوع الاسم | الصيغة |
          | --- | --- |
          | اسم محرف يونيكود | `ARABIC LETTER HAMZA` |
          | الاسم البرمجي للمفهوم | `hamzah` |
  - id: "044"
    category: "صور الاسم"
    name: "التهجئات البديلة"
    description: >-
      تُعد الصور الكتابية المختلفة للاسم نفسه تهجئات بديلة للبحث، ولا يُعد تغيير حالة الحروف أو
      الفاصل تهجئة بديلة.
    examples:
      - |
          | الصورة المعتمدة | الصورة الأخرى | العلاقة |
          | --- | --- | --- |
          | `hamzah` | `hamza` | تهجئة بديلة |
          | `waqf_lazim` | `waqf-lazim` | تغيير فاصل؛ لا يُعد تهجئة بديلة |
  - id: "045"
    category: "العلاقة بين الأسماء"
    name: "العلاقات بين الأسماء"
    description: >-
      يُميَّز الاسم المعتمد والتهجئة البديلة والمقابل الإنجليزي والاسم المتروك؛ فهذه علاقات مختلفة
      بين الأسماء.
    examples:
      - |
          | الاسم | علاقته بالاسم المعتمد |
          | --- | --- |
          | `ayah` | الاسم المعتمد |
          | `aya` | تهجئة بديلة لـ`ayah` |
          | `Verse` | مقابل إنجليزي لـ`ayah` |
          | `alamat_mawdi_al_sajdah` | اسم متروك لـ`sajdah_mark` |
  - id: "046"
    category: "الأسماء المتروكة"
    name: "الاسم المتروك"
    description: >-
      يُميَّز الاسم الصحيح الذي توقفت التوصية به في المشاريع الجديدة عن التهجئة البديلة، ويُبيَّن
      أنه اسم متروك يعود إلى المفهوم نفسه.
    examples:
      - |
          | الاسم المتروك | الاسم المعتمد للمفهوم نفسه |
          | --- | --- |
          | `alamat_mawdi_al_sajdah` | `sajdah_mark` |
  - id: "047"
    category: "الأسماء المتروكة"
    name: "الإحالة من الأسماء القديمة"
    description: >-
      إذا تغير اسم مفهوم أو دُمجت أسماء للمفهوم نفسه، تُحفظ الأسماء القديمة وإحالتها إلى الاسم
      الباقي مع تاريخ التغيير وسببه. ينطبق ذلك أيضًا عند سحب اسم من المعيار.
    examples:
      - |
          | الاسم القديم | الاسم الذي يحيل إليه |
          | --- | --- |
          | `alamat_mawdi_al_sajdah` | `sajdah_mark` |
      - |
          يُبيَّن سبب الدمج مع هذه الإحالة.
  - id: "048"
    category: "المفرد والجمع"
    name: "المفرد والجمع"
    description: >-
      يُستخدم المفرد لعنصر واحد والجمع لمجموعة عناصر.
    examples:
      - |
          | المقصود | الصيغة |
          | --- | --- |
          | آية واحدة | `ayah` |
          | مجموعة آيات | `ayahs` |
  - id: "049"
    category: "المفرد والجمع"
    name: "تكوين الجمع البرمجي"
    description: >-
      يُكوَّن الجمع البرمجي بإضافة `s` إلى الاسم البرمجي كاملًا، بما في ذلك الأسماء المركبة.
    examples:
      - |
          ```text
          ayahs
          juzs
          hizbs
          mushafs
          ```
  - id: "050"
    category: "أسماء التصنيفات وقيمها"
    name: "اسم التصنيف واللاحقة `_type`"
    description: >-
      يُسمَّى التصنيف بحسب ما يصنفه، وتقتصر اللاحقة `_type` على تصنيف نوع العلامة.
    examples:
      - |
          | المقصود | الاسم المعتمد | اسم لا يُستخدم لهذا التصنيف |
          | --- | --- | --- |
          | نوع علامة الوقف | `waqf_mark_type` | — |
          | حكم الوقف | `waqf_ruling` | `waqf_type` |
          | نمط التلاوة | `recitation_style` | `recitation_type` |
  - id: "051"
    category: "أسماء التصنيفات وقيمها"
    name: "العلامة ودلالتها وحكم الوقف"
    description: >-
      يُستخدم `waqf_mark` للعلامة المرسومة، و`waqf_mark_type` لتصنيف ما تدل عليه علامات الوقف،
      و`waqf_ruling` لتصنيف حكم الوقف في الموضع.
    examples:
      - |
          | المقصود | أمثلة القيم |
          | --- | --- |
          | دلالة علامة | `waqf_lazim` أو `waqf_mamnu` |
          | حكم الوقف في الموضع | `waqf_tamm` أو `waqf_kafi` |
  - id: "052"
    category: "أسماء التصنيفات وقيمها"
    name: "تسمية قيم التصنيف وتعريفها"
    description: >-
      يُحدَّد لكل نوع أو قيمة تصنيف ذات معنى اسم برمجي وتعريف، ولا يُكتفى باسم التصنيف العام.
    examples:
      - |
          | التصنيف | أمثلة القيم |
          | --- | --- |
          | `recitation_style` | `murattal`، `mujawwad`، `muallim` |
          | `recitation_pace` | `tahqiq`، `tadwir`، `hadr` |
          | `revelation_classification` | `makki`، `madani`، `disputed` |
  - id: "053"
    category: "أسماء التصنيفات وقيمها"
    name: "تمييز اسم قيمة التصنيف"
    description: >-
      يُضاف إلى اسم قيمة التصنيف اسم المفهوم الذي يميزها عند الحاجة، وتبقى الكلمات التي تفرقها عن
      القيم الأخرى.
    examples:
      - |
          ```text
          waqf_lazim
          waqf_jaiz_wasl_awla
          ```
  - id: "054"
    category: "أسماء التصنيفات وقيمها"
    name: "تفرّد الاسم داخل التصنيف"
    description: >-
      يجوز تكرار اسم قيمة في تصنيفين مختلفين إذا كان التصنيف معلومًا، ويجب أن يتفرد الاسم داخل
      التصنيف نفسه.
    examples:
      - |
          | التصنيف | اسم القيمة |
          | --- | --- |
          | تصنيف النزول | `makki` |
          | أنظمة عد الآي | `makki` |
  - id: "055"
    category: "أسماء التصنيفات وقيمها"
    name: "أسماء أنظمة عد الآي"
    description: >-
      يُستخدم اسم المدرسة اسمًا برمجيًا لقيم أنظمة عد الآي، بدل اشتقاق الاسم العربي الكامل.
    examples:
      - |
          ```text
          kufi
          basri
          dimashqi
          makki
          madani_first
          madani_last
          ```
  - id: "056"
    category: "أسماء السور والأشخاص"
    name: "أسماء الأشخاص"
    description: >-
      تُكتب أسماء المقرئين والرواة وغيرهم من الأشخاص المرتبطين بالمفردات القرآنية بالصيغة العلمية
      الإنجليزية بعد إزالة علامات النقل، مع شاهد على الصيغة.
    examples:
      - |
          ```text
          hafs
          warsh
          qalun
          ibn_dhakwan
          ```
  - id: "057"
    category: "أسماء السور والأشخاص"
    name: "اشتقاق أسماء السور"
    description: >-
      تُشتق أسماء السور من أسمائها العربية وفق قواعد التهجئة العامة.
    examples:
      - |
          ```text
          fatihah
          baqarah
          nisa
          ```
  - id: "058"
    category: "أسماء السور والأشخاص"
    name: "اشتراك المفهوم والفرد في الاسم"
    description: >-
      يجوز أن يشترك مفهوم وفرد في الاسم إذا كان نوع الفرد معلومًا ولا يلتبس بالمفهوم؛ ويشير الاسم
      المجرد إلى المفهوم. ينطبق ذلك عند اشتراك اسم قارئ أو سورة مع اسم مفهوم قرآني.
    examples:
      - |
          | المقصود | الاسم مع سياقه |
          | --- | --- |
          | علامة الهمزة | `hamzah` |
          | المقرئ حمزة | `qiraah:hamzah` |
          | درجة النقل | `tariq` |
          | سورة الطارق | `surah:tariq` |
  - id: "059"
    category: "تمييز المفاهيم"
    name: "تمييز المفاهيم المتقاربة"
    description: >-
      لا يُعد تشابه الأسماء أو الترجمات سببًا لتوحيد مفاهيم مختلفة، ولا يُنسب اسم مفهوم إلى مفهوم
      آخر.
    examples:
      - |
          | الاسم | المعنى |
          | --- | --- |
          | `word` | الكلمة في النص |
          | `token` | وحدة ينتجها التقطيع |
      - |
          قد يتطابقان في مثال، لكن الاسمين لا يصبحان مترادفين.
  - id: "060"
    category: "تمييز المفاهيم"
    name: "اسم العلامة واسم مدلولها"
    description: >-
      يكون للعلامة المرسومة في المصحف اسم يميزها عن المفهوم الذي تدل عليه.
    examples:
      - |
          | العلامة المرسومة | ما تدل عليه |
          | --- | --- |
          | علامة السكتة: `saktah_mark` | السكتة: `saktah` |
          | علامة السجدة: `sajdah_mark` | السجدة وموضعها: `sajdah` |
          | علامة الآية: `ayah_mark` | خاتمة الآية: `ayah_ending` |
  - id: "061"
    category: "تمييز المفاهيم"
    name: "السجدة وعلامتها"
    description: >-
      يُستخدم `sajdah` لموضع سجدة التلاوة وللسجود عنده، ويُستخدم `sajdah_mark` للعلامة المرسومة.
    examples:
      - |
          | المقصود | الاسم |
          | --- | --- |
          | الموضع والسجود عنده | `sajdah` |
          | العلامة المرسومة | `sajdah_mark` |
  - id: "062"
    category: "تمييز المفاهيم"
    name: "اسم العلامة بحسب موضعها"
    description: >-
      يُحدَّد اسم العلامة القرآنية بحسب معناها في موضعها، ولا تكفي نقطة ترميزها وحدها لتحديد
      الاسم.
    examples:
      - |
          | نقطة الترميز | الاسم بحسب المعنى |
          | --- | --- |
          | `U+06DC` | `saktah_mark` أو `seen_al_qiraah` بحسب الموضع |
          | `U+0652` و`U+06E1` | `sukun` |
  - id: "063"
    category: "تمييز المفاهيم"
    name: "الكلمة ووحدات تحليلها"
    description: >-
      يُستخدم `word` للكلمة في النص، و`token` لوحدة التقطيع، وأسماء التحليل الصرفي لما يُستخرج من
      الكلمة؛ ولا تُستخدم هذه الأسماء مترادفات.
    examples:
      - |
          | الاسم | المعنى |
          | --- | --- |
          | `word` | الكلمة التي يعرفها القارئ |
          | `token` | وحدة ينتجها منهج تقطيع |
          | `morpheme` | وحدة تحمل معنى أو وظيفة صرفية |
          | `lemma` | الصيغة المعجمية |
          | `root` | الجذر |
          | `morphology` | التحليل الصرفي |
          | `irab` | الإعراب |
  - id: "064"
    category: "تمييز المفاهيم"
    name: "وحدات النص وتمثيله"
    description: >-
      يُختار اسم وحدة النص بحسب المقصود: الحرف اللغوي، أو المحرف، أو نقطة الترميز، أو الوحدة
      الكتابية، أو الشكل المرسوم.
    examples:
      - |
          | الاسم | المعنى |
          | --- | --- |
          | `letter` | الحرف اللغوي |
          | `character` | المحرف، وحدة نصية مجردة |
          | `codepoint` | قيمة رقمية في نظام الترميز |
          | `grapheme` | وحدة كتابية يدركها القارئ وحدة واحدة |
          | `glyph` | الشكل الذي يرسمه الخط |
  - id: "065"
    category: "تمييز المفاهيم"
    name: "القرآن والمصحف"
    description: >-
      يُستخدم `quran` للقرآن، و`mushaf` للمصحف الذي كُتب فيه؛ ولا يُستخدم أحد الاسمين بدل الآخر.
    examples:
      - |
          | المقصود | الاسم |
          | --- | --- |
          | القرآن | `quran` |
          | المصحف | `mushaf` |
  - id: "066"
    category: "تمييز المفاهيم"
    name: "المحتوى والعرض"
    description: >-
      تُستخدم أسماء وحدات المحتوى لما يحمله النص، وأسماء العرض لما يتعلق بظهوره على الصفحة.
    examples:
      - |
          | المجال | أمثلة الأسماء |
          | --- | --- |
          | المحتوى | `surah`، `ayah`، `word` |
          | العرض | `page`، `line`، `layout`، `font`، `glyph` |
  - id: "067"
    category: "الأرقام والإحالات والتوقيت"
    name: "المعرّف الداخلي"
    description: >-
      يُستخدم `id` لمعرّف داخلي، ولا يُستخدم للرقم الذي يعرفه القارئ ويستشهد به.
    examples:
      - |
          | الاسم | المعنى |
          | --- | --- |
          | `ayah_id` | معرف داخلي |
          | `ayah_number` | رقم الآية داخل السورة |
  - id: "068"
    category: "الأرقام والإحالات والتوقيت"
    name: "الرقم المرجعي"
    description: >-
      يُستخدم `number` للرقم المعتمد للعنصر داخل مجاله، الذي يُعرض للقارئ ويُستشهد به.
    examples:
      - |
          ```text
          surah_number
          ayah_number
          page_number
          ```
  - id: "069"
    category: "الأرقام والإحالات والتوقيت"
    name: "الموضع في التسلسل"
    description: >-
      يُستخدم `position` لموضع عنصر داخل أب أو تسلسل، ولا يُعد إحالة ثابتة إذا تغيّر التسلسل.
    examples:
      - |
          ```text
          word_position
          token_position
          line_position
          ```
  - id: "070"
    category: "الأرقام والإحالات والتوقيت"
    name: "الترتيب الدلالي"
    description: >-
      يُستخدم `order` للترتيب المقصود دلاليًا حين يختلف عن موضع العنصر في التسلسل.
    examples:
      - |
          ```text
          revelation_order
          display_order
          ```
  - id: "071"
    category: "الأرقام والإحالات والتوقيت"
    name: "الإحالة المركبة"
    description: >-
      يُستخدم `key` للإحالة المركبة المقروءة: `ayah_key` لرقم السورة والآية، و`word_key` لمفتاح
      الآية وموضع الكلمة.
    examples:
      - |
          ```text
          ayah_key = surah_number:ayah_number
          2:255

          word_key = ayah_key:word_position
          2:255:3
          ```
  - id: "072"
    category: "الأرقام والإحالات والتوقيت"
    name: "نظام عد الآي في الإحالة"
    description: >-
      يرتبط معنى `ayah_key` و`word_key` بنظام عد الآي المستخدم؛ ويُعد `kufi` النظام المعتمد عند
      غياب البيان وفق قرار هذا المعيار.
    examples:
      - |
          ```text
          ayah_key: 2:255
          ```
      - |
          تُفسَّر الإحالة ضمن نظام العد المصرح به؛ الافتراضي `kufi`.
  - id: "073"
    category: "الأرقام والإحالات والتوقيت"
    name: "تسمية التوقيت الصوتي"
    description: >-
      داخل تسجيل تلاوة معين، يُسمَّى المدى الصوتي باسم وحدة النص التي يقابلها: `ayah_timing` للآية
      و`word_timing` للكلمة، دون إدخال القارئ أو الرواية أو النمط في الاسم.
    examples:
      - |
          | الاسم | المعنى |
          | --- | --- |
          | `ayah_timing` | مدى آية في تسجيل واحد |
          | `word_timing` | مدى كلمة في تسجيل واحد |
