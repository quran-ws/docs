concept: glyph
names:
  code: glyph
  display: Glyph
kind: unit
category: text
origin: borrowed
tier: core
status: draft
plural: glyphs
definition: الشكل البصري الذي ينتجه الخط لتمثيل حرف أو محرف أو مجموعة منها.
definition_en: >
  The visual shape a font produces to represent a letter, a character, or a group of
  them.
purpose: >
  يستخدم في الخطوط والرسم والعرض ومواضع الأشكال البصرية.
purpose_en: >
  Used for fonts, rasm, rendering and the placement of visual shapes.
boundaries:
  - الشكل المرسوم ينتجه الخط، وليس الحرف ولا المحرف؛ فالمحرف الواحد قد يرسم بأشكال شتى.
boundaries_en:
  - >-
    A glyph is produced by the font; it is neither the letter nor the character, and one
    character may be drawn by many glyphs.
related:
  - character
  - letter
  - font
sources: []
