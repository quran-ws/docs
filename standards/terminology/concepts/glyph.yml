concept: glyph
names:
  code: glyph
  display: Glyph
kind: unit
category: text
origin: borrowed
tier: core
status: draft
plural: glyphs
definition: الشكل البصري الذي ينتجه الخط لتمثيل حرف أو محرف أو مجموعة منها.
definition_en: >
  The visual shape a font produces to represent a letter, a character, or a group of
  them.
purpose: يستخدم في الخطوط والرسم والعرض ومواضع الأشكال البصرية، ولا يستخدم مرادفًا لـ`Letter`
  أو `Character`.
purpose_en: >
  Used for fonts, rasm, rendering and the placement of visual shapes. It is never used
  as a synonym for `Letter` or `Character`.
sources: []
