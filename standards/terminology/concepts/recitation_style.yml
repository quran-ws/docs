concept: recitation_style
names:
  code: recitation_style
  display: Recitation Style
  arabic:
    vocalized: نَمَط الأَدَاء
    singular: نمط الأداء
kind: classification
category: recitation_style
origin: standard
tier: core
status: draft
definition: >
  نمط الأداء هو تصنيف للتسجيلات والتلاوات بحسب طريقة أدائها، وهي مرتل أو مجود أو معلم،
  وهو مستقل عن القراءة والرواية.
definition_en: >
  A classification of recordings and recitations by how they are delivered, murattal,
  mujawwad or muallim, independent of the qiraah and the riwayah.
purpose: نستخدم نمط الأداء لتصنيف التسجيلات الصوتية بحسب طريقة الأداء أو الغرض منها.
purpose_en: >
  Used to classify audio recordings by their manner of delivery or by their purpose.
related:
  - murattal
  - mujawwad
  - muallim
  - recitation
  - recitation_pace
sources: []
