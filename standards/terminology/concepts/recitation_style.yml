plural: recitation_styles
definition: تصنيف يصف نمط أداء تلاوة أو تسجيل معين بصورة مستقلة عن القراءة والرواية.
definition_en: >
  A classification describing the manner of delivery of a recitation or a recording,
  independent of the qiraah and the riwayah.
purpose: يستخدم لتصنيف التسجيلات الصوتية بحسب طريقة الأداء أو الغرض منها.
purpose_en: >
  Used to classify audio recordings by their manner of delivery or by their purpose.
