  arabic:
    vocalized: التَّنْوِين
    singular: التنوين
kind: classification
category: dabt
parent: mushaf_mark
origin: quranic
tier: core
status: draft
definition: التنوين هو نون ساكنة زائدة تلحق آخر الاسم، وترسم بتكرار صورة الحركة.
definition_en: >
  An added vowelless noon at the end of a noun, written by doubling the shape of the
  vowel.
purpose: نستخدم التنوين أبًا لعلامات التنوين الـ3، حتى تجتمع في قائمة واحدة بدل تفريقها.
purpose_en: >
  Used as the parent of the three tanwin marks, gathering them instead of scattering
  them through one list.
alternative_spellings:
  - tanween
