concept: morpheme
names:
  code: morpheme
  display: Morpheme
  arabic:
    vocalized: الوَحْدَة الصَّرْفِيَّة
    singular: الوحدة الصرفية
kind: unit
category: linguistics
origin: borrowed
tier: core
status: draft
plural: morphemes
definition: >
  الوحدة الصرفية أصغر وحدة في الكلمة تحمل معنى أو وظيفة صرفية، مثل السابقة واللاحقة والجذع.
definition_en: >
  The smallest unit within a word carrying a meaning or a morphological function, such
  as a prefix, a suffix or a stem.
purpose: >
  نستخدمها لتمثيل تقسيم الكلمة القرآنية إلى أجزائها الصرفية، وهو المستوى الذي تُنسب إليه السمات
  الصرفية والوسوم في مدونات التحليل.
purpose_en: >
  Used to represent the division of a Quranic word into its morphological parts, which
  is the level that morphological features and tags are attached to in analysis corpora.
boundaries:
  - الوحدة الصرفية جزء من الكلمة، أما `token` فوحدة تقسيم قد تساوي الكلمة أو تزيد عليها.
boundaries_en:
  - >-
    A morpheme is a part of a word; a token is a unit of segmentation that may equal a
    word or span more than one.
alternative_spellings:
  - word_segment
related:
  - word
  - token
  - stem
  - morphology
note: >
  الاسم `segment` يعني في مدونات الصرف القرآني الوحدة الصرفية، ويعني في واجهات الصوت توقيت
  الكلمة. لذلك لا يُحل الاسم وحده إلى شيء، ويُحل `word_segment` إلى هذا المدخل، ويُحل المعنى
  الصوتي إلى `word_timing`.
note_en: >
  In Quranic morphology corpora `segment` means the morpheme; in audio APIs it means a
  word timing. The bare name resolves to nothing, `word_segment` resolves here, and the
  audio sense is `word_timing`.
sources: []
