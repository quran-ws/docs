definition: المتجانسان حرفان اتحدا في المخرج واختلفا في الصفة، مثل الدال والتاء في «قد تبين».
definition_en: >-
  Two letters of one point of articulation differing in attribute, like the dal and the taa
  in «قد تبين».
purpose: >-
  نستخدمه قيمة من قيم علاقة الحرفين، فنقرأ منه سبب الإدغام أو الإظهار في الموضع بدلًا من
  استنباطه من الحرفين في كل مرة.
purpose_en: >-
  Used as a value of the relation of two letters, so that the cause of idgham or izhar at
  the place is read from it rather than worked out from the two letters every time.
