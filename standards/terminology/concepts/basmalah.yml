concept: basmalah
names:
  code: basmalah
  display: Basmalah
  arabic:
    vocalized: البَسْمَلَة
    singular: البسملة
kind: concept
category: structure
origin: quranic
tier: core
status: draft
plural: basmalahs
definition: البسملة هي صيغة «بسم الله الرحمن الرحيم» التي تفتتح بها السور عدا سورة التوبة. ولها أحكام
  واختلافات مرتبطة بعد الآي.
definition_en: >
  The formula «بسم الله الرحمن الرحيم» with which the surahs open, except surah
  al-Tawbah. It carries rulings and differences bound up with ayah counting.
purpose: نستخدمها لتمييز البسملة وتمثيل موضعها وعلاقتها بالسورة ونظام عد الآي.
purpose_en: >
  Used to identify the basmalah and to represent its position and its relation to the
  surah and to the ayah numbering system.
alternative_spellings:
  - basmala
  - bismillah
related:
  - surah
  - ayah_numbering_system
  - istiadhah
