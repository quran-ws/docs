    singular: علامة السجدة
  dabt: عَلَامَة مَوْضِع السَّجْدَة — المِحْرَاب
  by_shape: مِحْرَاب صَغِير
  mushaf_introduction: عَلَامَة مَوْضِع السَّجْدَة
kind: mark
category: dabt
parent: mushaf_mark
origin: quranic
tier: core
status: draft
symbol: مِحْرَاب
definition: علامة السجدة علامة تدل على موضع السجود.
definition_en: Marks the point at which the reader prostrates.
purpose: نستخدمها علامة من علامات المصحف، فنعرف بها موضعها ودلالتها في العرض والتحليل.
purpose_en: Used as a mark of the mushaf, so that rendering and analysis know where it sits
  and what it points to.
boundaries:
- علامة السجدة رسم في المصحف، والسجدة موضع من النص يسجد عنده.
boundaries_en:
- The sajdah mark is a sign in the mushaf; the sajdah is the place in the text at which one
  prostrates.
