note: كان `alamat_mawdi_al_sajdah` مدخلًا مستقلًا يعرف الشيء نفسه، ثم دُمج في هذا المدخل.
note_en: '`alamat_mawdi_al_sajdah` was a separate entry defining the same thing; it was merged
