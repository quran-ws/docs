definition: الحدر هو الإسراع في القراءة مع المحافظة على الحروف والحركات وأحكام الأداء دون إخلال.
definition_en: >
  Reciting quickly while keeping the letters, the vowels and the rules of delivery
  intact.
purpose: >
  نستخدمه قيمة من قيم مراتب القراءة، فنوسم به التسجيل أو جلسة التعليم ونصفي به.
purpose_en: >
  Used as a value of recitation pace, so that a recording or a teaching session is
  tagged by its pace and filtered by it.
