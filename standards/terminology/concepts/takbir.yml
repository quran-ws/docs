concept: takbir
names:
  code: takbir
  display: Takbir
  arabic:
    vocalized: التَّكْبِير
    singular: التكبير
kind: concept
category: recitation
origin: quranic
tier: extended
status: draft
definition: >-
  قول «الله أكبر» بين السور، من آخر «الضحى» إلى آخر «الناس»، مرويًّا عن أهل مكة في رواية البزي
  عن ابن كثير، ويُفعل عند الختم على غيرها.
definition_en: >-
  Saying «الله أكبر» between the surahs from the end of al-Duha to the end of al-Nas, transmitted
  from the people of Makkah in the riwayah of al-Bazzi from Ibn Kathir, and done at a khatmah
  in other riwayahs.
purpose: >-
  يستخدم لوسم ما في التسجيل من التكبير بين السور، حتى لا يُحسب على آية ولا يسقط عند القص.
purpose_en: >-
  Used to tag the takbir between surahs in a recording, so that it is neither counted against
  an ayah nor lost when clipping.
boundaries:
- التكبير ليس من القرآن ولا من السورة، فلا آية له ولا توقيت آية.
boundaries_en:
- >-
  The takbir is no part of the Quran or of the surah, so it has no ayah and no ayah timing.
alternative_spellings:
- takbeer
- takbir_al_khatm
- takbir_al_khatmah
related:
- khatmah
- recitation
- basmalah
- istiadhah
sources:
