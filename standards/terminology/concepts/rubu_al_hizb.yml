definition: ربع الحزب هو الجزء الرابع من الحزب في التقسيم المشهور للمصحف.
definition_en: >
  A quarter of a hizb in the well-known division of the mushaf.
purpose: نستخدم ربع الحزب لتمثيل التقسيم الأدق للحزب ومواضع علاماته في المصحف.
purpose_en: >
  Used to represent the finer division of the hizb and where its marks fall in the
  mushaf.
