concept: tartil
names:
  code: tartil
  display: Tartil
  arabic:
    vocalized: التَّرْتِيل
    singular: الترتيل
kind: concept
category: recitation
origin: quranic
tier: core
status: draft
definition: الترتيل هو قراءة القرآن بتؤدة وبيان للحروف والكلمات ومراعاة الوقف والمعنى.
definition_en: >
  Reciting the Quran deliberately, making the letters and words distinct, observing the
  stops and the meaning.
purpose: نستخدم الترتيل صفة للأداء في وصف التسجيل والتعليم، وليس اسمًا للنمط الذي ينشر به التسجيل.
purpose_en: Used as a quality of delivery in describing a recording or a lesson, not as the name of the style a recording is published under.
boundaries:
  - الترتيل صفة الأداء نفسه، والمرتل نمط تسجيل، ولا يستعمل أحد الاسمين مكان الآخر.
boundaries_en:
  - >-
    Tartil is a quality of the delivery itself; murattal is a recording style. Neither
    name stands for the other.
alternative_spellings:
- tarteel
related:
  - murattal
  - recitation
  - recitation_pace
sources:
