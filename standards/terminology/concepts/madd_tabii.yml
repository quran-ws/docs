concept: madd_tabii
names:
  code: madd_tabii
  display: Madd Tabee
  display_evidence: >-
    GitHub phrase search: madd tabee 111 vs madd tabii 63. The display follows the
    dominant English form; the code stays derived.
  arabic:
    vocalized: المَدّ الطَّبِيعِيّ
    singular: المد الطبيعي
kind: classification_value
category: tajwid
parent: madd
origin: quranic
tier: core
status: draft
definition: >-
  المد الذي لا تقوم ذات حرف المد إلا به، ولا يتوقف على سبب من همز أو سكون، ومقداره حركتان.
definition_en: >-
  The madd without which the letter of madd itself does not stand, depending on no cause of
  hamzah or sukun; its length is 2 counts.
purpose: >-
  يستخدم قيمةً من قيم المد، فيوسم به موضع النص مع مقداره، ويُقرأ منه ما يختلف به الطريق في
  وصف التسجيل والمصحف.
purpose_en: >-
  Used as a value of madd, so that a place in the text is tagged with it and with its length,
  and what differs by tariq is read from it in describing a recording or a mushaf.
