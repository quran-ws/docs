symbol: ـْ
definition: الدَّلَالَة على سُكُون الحَرْف وإظْهَارِه، بحيث يَقْرَعُه اللِّسَان
definition_en: Marks the letter as vowelless and clearly articulated — the tongue strikes
  it.
purpose: تستخدم قيمةً من قيم الحركة، ليقرأ منها نطق الحرف في التحليل والعرض والتعليم بدل قراءة
  صورة الشكل.
purpose_en: Used as a value of harakah, so that a letter's pronunciation is read from it in
  analysis, rendering and teaching rather than from the shape of the mark.
