concept: ayah_fragment
names:
  code: ayah_fragment
  display: Ayah Fragment
  arabic:
    vocalized: مَقْطَع الآيَة
    singular: مقطع الآية
    plural: مقاطع الآيات
kind: unit
category: mushaf
origin: standard
tier: core
status: draft
plural: ayah_fragments
definition: >-
  مقطع الآية هو ما يظهر من آية واحدة في سطر واحد من صفحة مصحف بعينه. والآية التي تمتد على سطرين
  تتكون من مقطعين.
definition_en: >-
  What appears of one ayah on one line of a page of a given mushaf; an ayah that runs over
  two lines is two maqtas.
purpose: >-
  نستخدمه وحدة للعرض والوسم في تخطيط الصفحة، لأن الآية قد لا تنتهي مع نهاية السطر والسطر قد لا
  ينتهي مع نهاية الآية. وعليه نبني المحاذاة والإبراز في المصحف المرسوم.
purpose_en: >-
  Used as the unit of display and tagging in the page layout, because an ayah does not keep
  to a line nor a line to an ayah; alignment and highlighting in a drawn mushaf are built
  on it.
boundaries:
- المقطع صفة في تخطيط مصحف بعينه، وليس جزءًا من هوية الآية.
- >-
  المقطع ليس الكلمة، فقد يكون كلمة أو كلمات أو جزءًا من كلمة إذا وقع القطع داخلها.
boundaries_en:
- >-
  A maqta belongs to the layout of one mushaf and is no part of the identity of the ayah.
- >-
  A maqta is not a word: it may be a word, several words, or part of a word where the break
  falls inside one.
alternative_spellings:
- ayah_segment
- ayah_part
- line_ayah
- g_ayah
english_glosses:
- ayah fragment
related:
