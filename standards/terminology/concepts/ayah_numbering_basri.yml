concept: ayah_numbering_basri
names:
  code: ayah_numbering_basri
  display: Basri Numbering
  arabic:
    vocalized: العَدّ البَصْرِي
    singular: العد البصري
kind: classification_value
category: ayah_numbering
parent: ayah_numbering_system
origin: quranic
tier: core
status: draft
definition: >
  عد أهل البصرة، المروي عن عاصم الجحدري عن أسلافه من أهل البصرة.
definition_en: >
  The counting of the people of Basra, transmitted from Asim al-Jahdari from his
  predecessors among the Basrans.
purpose: >
  يستخدم قيمةً من قيم نظام عد الآي، فيعرف به ما تستند إليه أرقام الآيات وحدودها
  في مصحف أو dataset، وتقابل به مواضع الآي بين الأنظمة.
purpose_en: >
  Used as a value of the ayah numbering system, so that what a Mushaf's or a dataset's
  ayah numbers and boundaries rest on is known, and ayah positions can be mapped between
  systems.
alternative_spellings:
  - basri_numbering
  - basran_numbering
related:
  - ayah_numbering_system
  - ayah
  - equivalent_ayah
note: >
  الاسم البرمجي هنا اسم الأصل وما يميز القيمة، لا اشتقاق من الاسم العربي؛
  فاشتقاق «العَدّ» يعطي `add` وهو فعل إنجليزي، و`makki` مأخوذ قيمةً من قيم
  `revelation_classification`. والوجه في ذلك مسجل في سجل القرارات.
note_en: >
  The code name here is the name of the school and what distinguishes the value, not a
  derivation of the Arabic name: deriving from «العَدّ» gives `add`, an English verb,
  and `makki` is already a value of `revelation_classification`. The reasoning is in the
  decision record.
sources: []
