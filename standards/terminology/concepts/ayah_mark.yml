concept: ayah_mark
names:
  code: ayah_mark
  display: Ayah Mark
  arabic:
    vocalized: عَلَامَة الآيَة
    singular: علامة الآية
  dabt: عَلَامَة رَأْس الآيَة
  by_shape: دَارَة
  mushaf_introduction: عَلَامَة رَأْس الآيَة
  unicode: ARABIC END OF AYAH
kind: mark
category: dabt
parent: mushaf_mark
origin: quranic
tier: core
status: draft
symbol: ۝
definition: >
  الدَّارَة الفاصلة بين الآيتين، توضع عند نهاية الآية ويكتب فيها رقمها في أكثر
  المصاحف.
definition_en: >
  The circle separating one ayah from the next. It is placed at the ayah's end and, in
  most mushafs, carries its number.
purpose: >
  تستخدم لتحديد حدود الآية في النص المكتوب، وهي العلامة التي يقرأ منها المحلل
  والعارض نهاية الآية ورقمها.
purpose_en: >
  Used to mark an ayah's boundary in the written text; it is the sign from which a
  renderer or an analyser reads where an ayah ends and what its number is.
boundaries:
  - العلامة رسم في المصحف، والفاصلة خاتمة الآية من جهة النظم.
  - رقم الآية داخل الدارة يتبع نظام عد الآي، ولا يعد جزءًا من العلامة.
boundaries_en:
  - >-
    The mark is something drawn in the mushaf; the fasilah is the ayah's ending as a
    matter of the text itself.
  - >-
    The number inside the circle follows an ayah numbering system and is not part of the
    mark.
alternative_spellings:
  - end_of_ayah
  - ayah_marker
  - ayah_separator
