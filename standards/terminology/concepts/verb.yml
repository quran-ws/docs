concept: verb
names:
  code: verb
  display: Verb
  arabic:
    vocalized: الفِعْل
    singular: الفعل
kind: classification_value
category: linguistics
parent: part_of_speech
origin: borrowed
tier: core
status: draft
definition: >
  الفعل هو ما دل على معنى في نفسه مقترن بزمان، ويتصرف إلى الماضي والمضارع والأمر.
definition_en: >
  A verb: a word whose meaning is tied to a time, with past, present and imperative
  forms.
purpose: >
  نستخدمه قيمة من قيم قسم الكلمة، ونعلق عليه السمات الصرفية الخاصة بالفعل، مثل الزمن والبناء
  للمعلوم أو المجهول والوزن.
purpose_en: >
  Used as a value of part of speech, and the morphological features specific to verbs —
  tense, voice and pattern — hang off it.
related:
  - part_of_speech
  - morphology
