concept: tanwin_al_damm
names:
  code: tanwin_al_damm
  display: Tanwin al-Damm
  arabic:
    vocalized: تَنْوِين الضَّمّ
    singular: تنوين الضم
  dabt: تَنْوِين الرَّفْع — الضَّمَّتَان
  by_shape: وَاوَان صَغِيرَتَان فَوْق الحَرْف
  mushaf_introduction: 'الحَرَكَتَان: تَرْكِيبًا أو تَتَابُعًا'
  unicode: ARABIC DAMMATAN
kind: mark
category: dabt
parent: tanwin
origin: quranic
tier: core
status: draft
symbol: ـٌ
definition: الدلالة على التنوين المرفوع. وتركيب الحركتين يدل على إظهار التنوين، وتتابعهما
  مع تشديد التالي على الإدغام الكامل، ودونه على الإدغام الناقص أو الإخفاء
definition_en: Marks the un tanwin. Stacked marks signal izhar; staggered marks with a shaddah
  on the next letter signal complete idgham, and without one, incomplete idgham or ikhfa.
purpose: تستخدم قيمةً من قيم التنوين، ليقرأ منها نطق آخر الاسم وحكمه بدل قراءة صورة الشكل.
purpose_en: Used as a value of tanwin, so that the pronunciation of the noun's ending and
  its ruling are read from it rather than from the shape of the mark.
