concept: madd_muttasil
names:
  code: madd_muttasil
  display: Madd Muttasil
  arabic:
    vocalized: المَدّ المُتَّصِل
    singular: المد المتصل
kind: classification_value
category: tajwid
parent: madd
origin: quranic
tier: core
status: draft
definition: >-
  مد فرعي سببه همزة بعد حرف المد في كلمة واحدة، وهو واجب عند القراء جميعًا، وتختلف مقاديره
  بحسب الرواية والطريق.
definition_en: >-
  A secondary madd caused by a hamzah after the letter of madd within one word; it is obligatory
  for all the readers, and its lengths differ by riwayah and tariq.
purpose: >-
  يستخدم قيمةً من قيم المد، فيوسم به موضع النص مع مقداره، ويُقرأ منه ما يختلف به الطريق في
  وصف التسجيل والمصحف.
purpose_en: >-
  Used as a value of madd, so that a place in the text is tagged with it and with its length,
  and what differs by tariq is read from it in describing a recording or a mushaf.
alternative_spellings:
