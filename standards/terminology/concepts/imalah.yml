definition: علامة الإمالة تدل على الإمالة الكبرى، وهي نطق الفتحة مائلة إلى الكسرة، وترد في
  رواية حفص في موضع واحد (11:41).
definition_en: 'Marks the major imalah: a fathah pronounced leaning toward kasrah. In the
  riwayah of Hafs it occurs at one place only (11:41).'
purpose: نستخدمها قيمة من علامات القراءة، فننبه بها القارئ إلى أداء خاص في موضعها.
purpose_en: Used as a value of the qiraah marks, so that the reader is alerted to a particular
  delivery at its place.
