concept: letter_relation
names:
  code: letter_relation
  display: Letter Relation
  arabic:
    vocalized: عَلَاقَة الحَرْفَيْن
    singular: علاقة الحرفين
kind: classification
category: tajwid
origin: quranic
tier: extended
status: draft
definition: >-
  علاقة الحرفين هي نسبة الحرفين المتجاورين أحدهما إلى الآخر في المخرج والصفة، وهي تماثل أو تجانس
  أو تقارب أو تباعد. وعليها يُبنى إدغام الأول في الثاني أو إظهاره.
definition_en: >-
  The relation of two adjacent letters to each other in point of articulation and attribute:
  identical, of one kind, close, or distant; the merging of the first into the second, or
  its clear sounding, is built on it.
purpose: >-
  نستخدمها تصنيفًا نوسم به الموضع الذي يقع فيه إدغام الحرفين أو إظهارهما، حتى يُعرف سبب الحكم
  وليس الحكم وحده.
purpose_en: >-
  Used as a classification tagging the place where two letters are merged or sounded apart,
  so that the cause of the ruling is known and not only the ruling.
boundaries:
- العلاقة سبب، والإدغام والإظهار حكم يترتب عليها.
boundaries_en:
- >-
  The relation is a cause; idgham and izhar are the ruling that follows from it.
alternative_spellings:
- letter_relations
- alaqat_al_huruf
- ilaqat_al_harfayn
english_glosses:
- relation of two letters
related:
- idgham
- izhar
- mutamathilan
- mutajanisan
