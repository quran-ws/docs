  transliteration: āyah
  arabic:
    vocalized: آيَة
    singular: آية
    plural: آيات
kind: entity
category: structure
origin: quranic
tier: core
status: draft
plural: ayahs
definition: >
  وحدة من النص القرآني تقع ضمن سورة ولها حدود محددة، وقد يختلف رقمها أو بعض
  حدودها باختلاف نظام عد الآي.
purpose: >
  تستخدم كوحدة أساسية للإشارة إلى النص القرآني وربط الترجمات والتفاسير
  والتلاوات والتحليلات والبيانات الأخرى بموضع محدد من القرآن.
boundaries:
  - موقعها في صفحة أو سطر يخص المصحف أو الـlayout، لا هوية الآية نفسها.
  - الفاصلة نهاية الآية، وليست الآية.
