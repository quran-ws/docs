concept: ayah
names:
  code: ayah
  display: Ayah
  transliteration: āyah
  arabic:
    vocalized: الآيَة
    singular: الآية
    plural: آيات
kind: entity
category: structure
origin: quranic
tier: core
status: draft
plural: ayahs
definition: >
  الآية وحدة من النص القرآني تقع داخل سورة ولها حدود محددة. وقد يختلف رقمها أو بعض حدودها
  باختلاف نظام عد الآي.
definition_en: >
  A unit of the Quranic text falling within a surah and having determined boundaries.
  Its number, and some of its boundaries, may differ from one ayah numbering system to
  another.
purpose: >
  نستخدمها وحدة أساسية للإشارة إلى النص القرآني، ولربط الترجمات والتفاسير والتلاوات والتحليلات
  والبيانات الأخرى بموضع محدد من القرآن.
purpose_en: >
  Used as the basic unit for referring to the Quranic text, and for attaching
  translations, tafsir, recitations, analyses and other data to a specific place in the
  Quran.
boundaries:
  - موقع الآية في صفحة أو سطر يخص المصحف أو تخطيطه، وليس جزءًا من هوية الآية نفسها.
  - الفاصلة هي نهاية الآية وليست الآية نفسها.
boundaries_en:
  - >-
    Its position on a page or a line belongs to the mushaf and its layout, not to the
    identity of the ayah.
  - >-
    The ayah ending is the close of the ayah, not the ayah.
alternative_spellings:
  - aya
  - ayat
  - ayaat
