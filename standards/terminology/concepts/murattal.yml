concept: murattal
names:
  code: murattal
  display: Murattal
  arabic:
    vocalized: مُرَتَّل
    singular: مرتل
kind: classification_value
category: recitation_style
parent: recitation_style
origin: quranic
tier: core
status: draft
definition: >
  نمط أداء متزن دون تطريب، على مرتبة الترتيل، وهو الوصف الذي تنشر به التسجيلات المؤداة
  على هذا النحو.
definition_en: >
  A recitation style that is measured and unadorned, at a reading pace; the label given
  to recordings delivered that way.
purpose: >
  يستخدم لتصنيف التسجيل بحسب نمطه.
purpose_en: >
  Used to classify a recording by its style.
boundaries:
  - المرتل نمط تسجيل، والترتيل صفة الأداء نفسه؛ فلا يستعمل أحد الاسمين مكان الآخر.
boundaries_en:
  - >-
    Murattal is a recording style; tartil is a quality of the delivery itself. Neither
    name stands for the other.
related:
  - recitation_style
  - mujawwad
  - tartil
sources: []
