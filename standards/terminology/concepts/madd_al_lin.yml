concept: madd_al_lin
names:
  code: madd_al_lin
  display: Madd al-Lin
  arabic:
    vocalized: مَدّ اللِّين
    singular: مد اللين
kind: classification_value
category: tajwid
parent: madd
origin: quranic
tier: core
status: draft
definition: >-
  مد اللين هو مد الواو أو الياء الساكنة المفتوح ما قبلها عند الوقف على الكلمة بسكون عارض، مثل
  «خوف» و«بيت».
definition_en: >-
  Lengthening a vowelless waw or yaa preceded by a fathah when stopping on the word with an
  incidental sukun, as in «خوف» and «بيت».
purpose: >-
  نستخدمه قيمة من قيم المد، فنوسم به موضع النص مع مقداره، ونقرأ منه ما يختلف باختلاف الطريق في
  وصف التسجيل والمصحف.
purpose_en: >-
  Used as a value of madd, so that a place in the text is tagged with it and with its length,
  and what differs by tariq is read from it in describing a recording or a mushaf.
alternative_spellings:
