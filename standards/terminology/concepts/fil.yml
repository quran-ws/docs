concept: fil
names:
  code: fil
  display: Fil
  arabic:
    vocalized: الفِعْل
    singular: الفعل
kind: classification_value
category: linguistics
parent: part_of_speech
origin: quranic
tier: core
status: draft
definition: >
  ما دل على معنى في نفسه مقترن بزمان، ويتصرف بالماضي والمضارع والأمر.
definition_en: >
  A verb: a word whose meaning is tied to a time, with past, present and imperative
  forms.
purpose: >
  يستخدم قيمةً من قيم قسم الكلمة، وعليه تعلق السمات الصرفية الخاصة بالفعل من
  الزمن والبناء للمعلوم أو المجهول والوزن.
purpose_en: >
  Used as a value of part of speech, and the morphological features specific to verbs —
  tense, voice and pattern — hang off it.
