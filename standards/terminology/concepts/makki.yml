concept: makki
names:
  code: makki
  display: Makki
  transliteration: makkī
  arabic:
    vocalized: مَكِّيّ
    singular: مكي
kind: classification_value
category: revelation
parent: revelation_classification
origin: quranic
tier: core
status: draft
definition: >
  المكي ما نزل من القرآن قبل الهجرة، ولو نزل خارج مكة.
definition_en: >
  The part of the Quran revealed before the Hijrah, even where it was revealed outside
  Makkah.
purpose: نستخدمه قيمة من قيم تصنيف النزول، فنوسم به السورة أو الآية.
purpose_en: Used as a value of revelation classification, tagging a surah or an ayah with it.
boundaries:
  - مكي وصف لزمن النزول قبل الهجرة، وليس لمكان النزول.
boundaries_en:
  - Makki describes the time of revelation, before the Hijrah, not the place of revelation.
alternative_spellings:
  - makkiyy
  - makkan
english_glosses:
  - Meccan
related:
  - madani
  - revelation_classification
  - revelation
sources:
  - id: qattan_mabahith
    ref: "1/60"
  - id: itqan
    ref: "1/37"
