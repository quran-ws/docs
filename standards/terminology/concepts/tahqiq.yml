concept: tahqiq
names:
  code: tahqiq
  display: Tahqiq
  arabic:
    vocalized: التَّحْقِيق
    singular: التحقيق
kind: classification_value
category: recitation_pace
parent: recitation_pace
origin: quranic
tier: core
status: draft
definition: التحقيق هو القراءة ببطء وتؤدة مع استيفاء الحروف وأحكامها، ويستخدم كثيرًا في مقام التعليم.
definition_en: >
  Reciting slowly and deliberately, giving the letters and their rules their full due;
  much used in teaching.
purpose: >
  نستخدم التحقيق قيمة من قيم مراتب القراءة، نوسم بها التسجيل أو جلسة التعليم ونصفي
  بها.
purpose_en: >
  Used as a value of recitation pace, so that a recording or a teaching session is
  tagged by its pace and filtered by it.
alternative_spellings:
- tahqeeq
related:
  - recitation_pace
