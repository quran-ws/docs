concept: disputed
names:
  code: disputed
  display: Disputed
  arabic:
    vocalized: مُخْتَلَف فِيه
    singular: مختلف فيه
kind: classification_value
category: revelation
parent: revelation_classification
origin: standard
tier: core
status: draft
definition: ما اختلفت المصادر المعتمدة في تصنيفه بين المكي والمدني.
definition_en: >
  A surah or ayah that the accepted sources do not agree to classify as makki or madani.
purpose: >
  يمنع إجبار البيانات المختلف فيها على قيمة `makki` أو `madani` دون توثيق الخلاف.
purpose_en: >
  Keeps disputed data from being forced into `makki` or `madani` without recording the
  disagreement.
alternative_spellings:
  - mukhtalaf_fih
  - revelation_disputed
related:
  - revelation_classification
  - makki
  - madani
sources:
  - id: qattan_mabahith
    ref: "1/60"
  - id: itqan
    ref: "1/37"
