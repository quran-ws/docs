concept: waqf_ikhtibari
names:
  code: waqf_ikhtibari
  display: Waqf Ikhtibari
  arabic:
    vocalized: الوَقْف الاِخْتِبَارِيّ
    singular: الوقف الاختباري
kind: classification_value
category: waqf
parent: sabab_al_waqf
origin: quranic
tier: extended
status: draft
definition: >-
  ما يقع لبيان المقطوع والموصول والثابت والمحذوف من الرسم، عند سؤال أو تعليم.
definition_en: >-
  A stop made to show what is cut and what is joined, what is written and what is omitted
  in the rasm, at a question or in teaching.
purpose: >-
  يستخدم قيمةً من قيم سبب الوقف، فيُوسم به الوقف الواقع في التلاوة عند تحليلها أو تعليمها.
purpose_en: >-
  Used as a value of the cause of the stop, tagging a stop that occurred in a tilawah when
  it is analysed or taught.
alternative_spellings:
- ikhtibari
- waqf_ikhtibary
related:
- sabab_al_waqf
- waqf
