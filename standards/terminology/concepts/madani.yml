concept: madani
names:
  code: madani
  display: Madani
  arabic:
    vocalized: مَدَنِيّ
    singular: مدني
kind: classification_value
category: revelation
parent: revelation_classification
origin: quranic
tier: core
status: draft
definition: ما نزل من القرآن بعد الهجرة، ولو نزل خارج المدينة.
definition_en: >
  The part of the Quran revealed after the Hijrah, even where it was revealed outside
  Madinah.
purpose: يستخدم قيمةً من قيم تصنيف النزول، فتوسم به السورة أو الآية.
purpose_en: Used as a value of revelation classification, tagging a surah or an ayah with it.
boundaries:
- مدني وصف لزمن النزول بعد الهجرة، لا لمكان النزول.
boundaries_en:
- Madani describes the time of revelation, after the Hijrah, not the place of revelation.
alternative_spellings:
- madaniyy
- madinan
english_glosses:
  - Medinan
