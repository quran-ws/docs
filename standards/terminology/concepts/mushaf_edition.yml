definition: طبعة المصحف إصدار منشور محدد من المصحف، له خصائص محددة مثل الناشر والرسم والضبط والتخطيط وغيرها.
definition_en: >
  A specific published edition of the mushaf with its own publisher, rasm, dabt, layout
  and other properties.
purpose: نستخدمها لتمييز الطبعات التي قد تختلف في الصفحات والأسطر والعلامات أو الخصائص الطباعية.
purpose_en: >
  Used to tell apart editions that may differ in pages, lines, marks or typographic
  properties.
