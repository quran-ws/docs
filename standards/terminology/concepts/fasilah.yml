concept: fasilah
names:
  code: fasilah
  display: Fasilah
  arabic:
    vocalized: الفَاصِلَة
    singular: الفاصلة
kind: concept
category: structure
origin: quranic
tier: core
status: draft
plural: fasilahs
definition: خاتمة الآية أو المقطع من جهة النظم، ويعرفها بعض العلماء بأنها الكلمة الأخيرة من
  الآية.
definition_en: >
  The close of an ayah or a passage as a matter of its composition; some scholars define
  it as the ayah's last word.
purpose: تستخدم في الدراسات والبيانات التي تتناول فواصل الآيات والنظم القرآني، ولا تستخدم
  مرادفًا لـ`Ayah`.
purpose_en: >
  Used in studies and datasets concerned with ayah endings and Quranic composition. It
  is never used as a synonym for `Ayah`.
alternative_spellings:
- fasila
english_glosses:
- Verse Ending
sources: []
