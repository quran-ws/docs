concept: part_of_speech
names:
  code: part_of_speech
  display: Part of Speech
  arabic:
    vocalized: قِسْم الكَلِمَة
    singular: قسم الكلمة
kind: classification
category: linguistics
origin: borrowed
tier: core
status: draft
definition: >
  قسم الكلمة هو تصنيف الكلمة أو الوحدة الصرفية بحسب بابها النحوي، مثل الاسم والفعل
  والحرف وما يتفرع عنها.
definition_en: >
  The classification of a word or a morpheme by its grammatical class: noun, verb, particle
  and what branches from them.
purpose: >
  نستخدم قسم الكلمة وسمًا أساسيًا في التحليل الصرفي والنحوي، ويقوم عليه البحث بالوسم
  والتصفية وبناء التحليل الإعرابي.
purpose_en: >
  Used as the basic tag in morphological and syntactic analysis; searching by tag,
  filtering, and building the syntactic analysis all rest on it.
alternative_spellings:
  - pos
related:
  - morphology
  - irab
  - morpheme
note: >
  المعيار يثبت القسمة الثلاثية فقط. أما الوسوم التفصيلية التي تستعملها مدونات الصرف
  القرآني، وعددها عشرات، فهي بيانات تندرج تحت هذه القيم الثلاث ولا تفرد لها مداخل في
  القاموس.
note_en: >
  The threefold division is the level this standard fixes. The detailed tags used by
  Quranic morphology corpora — dozens of them — are data falling under these three
  values, and are not given entries of their own in the dictionary.
