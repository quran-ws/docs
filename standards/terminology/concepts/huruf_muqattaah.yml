concept: huruf_muqattaah
names:
  code: huruf_muqattaah
  display: Huruf Muqattaah
  arabic:
    vocalized: الحُرُوف المُقَطَّعَة
    singular: الحروف المقطعة
kind: concept
category: structure
origin: quranic
tier: core
status: draft
definition: >-
  مجموعة الحروف الهجائية التي افتُتحت بها 29 سورة، تُقرأ بأسماء الحروف لا بمسمياتها، مثل «الم»
  و«كهيعص».
definition_en: >-
  The group of alphabetic letters that open 29 surahs, read by the names of the letters and
  not by their sounds, such as «الم» and «كهيعص».
purpose: >-
  تستخدم لوسم فواتح السور التي تُقرأ بأسماء حروفها، فتُعامل في التلاوة والمد والبحث والترجمة
  معاملة تخصها.
purpose_en: >-
  Used to tag the surah openings that are read by the names of their letters, so that recitation,
  madd, search and translation treat them in their own way.
boundaries:
- الحرف المقطع الواحد `harf_muqatta`، وهذه الفاتحة مجموعةً.
- الفاتحة آية أو جزء آية بحسب نظام العد، وليست اسمًا للسورة.
boundaries_en:
- A single letter is a `harf_muqatta`; this is the opening as a group.
- >-
  The opening is an ayah or part of one depending on the numbering system, and is not the
  name of the surah.
alternative_spellings:
- muqattaat
- al_muqattaat
- huruf_muqattaat
- huroof_muqattaat
- fawatih_al_suwar
english_glosses:
- disjointed letters
- mysterious letters
related:
