concept: tajwid
names:
  code: tajwid
  display: Tajweed
  display_evidence: >
    GitHub phrase search: tajweed 45,440 vs tajwid 25,280. The doubled form is
    dominant in English writing, so it is what readers see; the code name stays
    derived, because the doubling in general use is lexical and not a rule.
  transliteration: tajwīd
  arabic:
    vocalized: تَجْوِيد
    singular: تجويد
kind: concept
category: tajwid
origin: quranic
tier: core
status: draft
definition: >
  علم أداء حروف القرآن من مخارجها وإعطائها حقوقها ومستحقاتها من الصفات
  والأحكام.
purpose: >
  يمثل المجال الجامع لقواعد التجويد وأحكامه وannotations التطبيقات، وتنسب
  إليه الأحكام والقواعد في القواميس والمحركات.
alternative_spellings:
  - tajweed
related:
  - tilawah
  - waqf
sources:
