  display: Waqf Qabih
  arabic:
    vocalized: الوَقْف القَبِيح
    singular: الوقف القبيح
kind: classification_value
category: waqf
parent: waqf_ruling
origin: quranic
tier: core
status: draft
definition: الوقف القبيح هو الوقف على ما لم يفد معنًى، أو أفاد معنًى غير مراد.
definition_en: >
  A stop that yields no meaning, or yields a meaning that is not the one intended.
purpose: نستخدم الوقف القبيح قيمة من قيم حكم الوقف، ونوسم به الموضع في التعليم والتحليل.
purpose_en: Used as a value of the waqf ruling, so that a place is tagged with it in teaching and analysis.
