concept: mushaf
names:
  code: mushaf
  display: Mushaf
  arabic:
    vocalized: المُصْحَف
    singular: المصحف
kind: entity
category: core
origin: quranic
tier: core
status: draft
plural: mushafs
definition: >
  الصحف التي جمع فيها القرآن مكتوبًا ومرتبًا على ترتيبه المعروف.
definition_en: >
  The Quran as a written, bound book, in its established order.
purpose: يستخدم عندما تكون خصائص التمثيل المكتوب للقرآن مهمة، مثل الرسم والتخطيط والصفحات
  والأسطر والعلامات.
purpose_en: >
  Used when the properties of the written representation matter: rasm, layout, pages,
  lines and marks.
boundaries:
  - المصحف وعاء مكتوب للقرآن وليس القرآن نفسه؛ فتختلف المصاحف في الرسم والصفحات والعلامات والقرآن واحد.
boundaries_en:
  - >-
    A mushaf is a written vessel for the Quran, not the Quran itself: mushafs differ in
    rasm, pages and marks while the Quran is one.
alternative_spellings:
  - mus'haf
  - muṣḥaf
  - moshaf
english_glosses:
- Quran Codex
related:
  - quran
  - mushaf_edition
  - rasm
  - layout
  - page
sources:
  - id: qattan_mabahith
    ref: "1/119"
