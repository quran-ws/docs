concept: ghunnah
names:
  code: ghunnah
  display: Ghunnah
  arabic:
    vocalized: الغُنَّة
    singular: الغنة
kind: concept
category: tajwid
origin: quranic
tier: core
status: draft
definition: >-
  صوت يخرج من الخيشوم مركب في جسم النون والميم لا عمل للسان فيه، ويختلف مقداره بحسب الحكم:
  أكمل ما يكون في المشدد والمدغم، ثم في المخفى، ثم في الساكن المظهر.
definition_en: >-
  A sound from the nasal cavity built into the body of noon and meem, in which the tongue
  plays no part; its length differs by ruling, fullest in the doubled and the merged letter,
  then in the concealed, then in the vowelless letter sounded clearly.
purpose: >-
  تستخدم صفةً تُوسم بها مواضع النص التي تُمد فيها الغنة، كالمشددتين والإدغام بغنة والإخفاء
  والإقلاب، ليُتبع في التلوين والتعليم، ولأن مقدارها مما يختلف به الطريق.
purpose_en: >-
  Used as an attribute tagging the places in the text where the ghunnah is held, such as the
  two doubled letters, idgham with ghunnah, ikhfa and iqlab, so that it is followed in colouring
  and instruction, and because its length is among what differs by tariq.
boundaries:
- >-
  الغنة صفة صوت لا حكم في نفسها، فهي تلحق الإدغام والإخفاء والإقلاب ولا تقابلها.
boundaries_en:
- >-
  Ghunnah is an attribute of sound and not a ruling in itself: it accompanies idgham, ikhfa
  and iqlab and does not stand opposite them.
