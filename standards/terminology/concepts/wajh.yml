concept: wajh
names:
  code: wajh
  display: Wajh
  arabic:
    vocalized: الوَجْه
    singular: الوجه
    plural: أَوْجُه
kind: concept
category: qiraat
origin: quranic
tier: extended
status: draft
plural: wajhs
definition: >-
  الوجه هو كيفية من كيفيات الأداء يجوز الأخذ بأي منها في الرواية الواحدة أو الطريق
  الواحد، مثل أوجه المد العارض للسكون.
definition_en: >-
  One of several manners of delivery, any of which may be taken within one riwayah or one
  tariq, such as the wajhs of madd arid li al-sukun.
purpose: >-
  نستخدم الوجه حين يحتاج التسجيل أو التعليم إلى تعيين الوجه المأخوذ به من أوجه جائزة،
  من غير أن ينسب الاختلاف إلى رواية أو طريق.
purpose_en: >-
  Used when a recording or a lesson needs to state which of the permitted wajhs was taken,
  without attributing the difference to a riwayah or a tariq.
boundaries:
- الوجه لا يغير نسبة القراءة، والطريق يغيرها.
boundaries_en:
- >-
  A wajh does not change what the reading is attributed to; a tariq does.
alternative_spellings:
- wajh_al_ada
- awjuh
- wujuh
- wajh_qiraah
english_glosses:
- permitted variant
related:
- tariq
- riwayah
- madd_arid_li_al_sukun
