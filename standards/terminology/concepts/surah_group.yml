concept: surah_group
names:
  code: surah_group
  display: Surah Group
  arabic:
    vocalized: تَصْنِيف السُّوَر
    singular: تصنيف السور
kind: classification
category: surah_classification
origin: standard
tier: extended
status: draft
definition: تصنيف يجمع سورًا وفق تقسيمات اصطلاحية موروثة تعتمد الطول أو موضعها ضمن مجموعات
  السور.
definition_en: >
  A classification gathering surahs by inherited conventional divisions that rest on
  length or on their place among the groups of surahs.
purpose: يوفر parent موحدًا لتصنيفات مثل الطوال والمئين والمثاني والمفصل.
purpose_en: >
  Gives classifications such as the tiwal, the miun, the mathani and the mufassal one
  parent.
