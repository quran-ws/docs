concept: noon_sakinah
names:
  code: noon_sakinah
  display: Noon Sakinah
  display_evidence: >
    GitHub phrase search: noon sakinah 478 vs nun sakinah 118. Letter names are
    written as they are said, so the derivation gives noon rather than nun.
  transliteration: nūn sākinah
  arabic:
    vocalized: النُّون السَّاكِنَة
    singular: النون الساكنة
kind: concept
category: tajwid
origin: quranic
tier: core
status: draft
definition: >
  نون خالية من الحركة، تثبت لفظًا وخطًا ووصلًا ووقفًا.
definition_en: >
  A noon carrying no vowel, fixed in pronunciation and in writing, in continuing and in
  stopping.
purpose: >
  تستخدم موضعًا تتفرع عليه أحكام الإظهار والإدغام والإقلاب والإخفاء في محركات التجويد.
purpose_en: >
  Used as the trigger of the four rulings, izhar, idgham, iqlab and ikhfa, in tajwid
  engines.
alternative_spellings:
- nun_sakinah
- noon_saakinah
related:
