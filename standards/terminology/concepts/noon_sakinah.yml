definition: >
  نون خالية من الحركة، تثبت لفظًا وخطًا ووصلًا ووقفًا.
purpose: >
  نستخدمها موضعًا تتفرع عليه أحكام الإظهار والإدغام والإقلاب والإخفاء في
  محركات التجويد.
