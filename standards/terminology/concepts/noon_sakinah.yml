definition: 'نون خالية من الحركة، تثبت لفظًا وخطًا ووصلًا ووقفًا.

  '
definition_en: >
  A noon carrying no vowel, fixed in pronunciation and in writing, in continuing and in
  stopping.
purpose: 'نستخدمها موضعًا تتفرع عليه أحكام الإظهار والإدغام والإقلاب والإخفاء في محركات التجويد.

  '
purpose_en: >
  We use it as the place that the rulings of izhar, idgham, iqlab and ikhfa branch from
  in tajwid engines.
