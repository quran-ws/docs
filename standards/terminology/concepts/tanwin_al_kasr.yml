concept: tanwin_al_kasr
names:
  code: tanwin_al_kasr
  display: Tanwin al-Kasr
  arabic:
    vocalized: تَنْوِين الكَسْر
    singular: تنوين الكسر
  dabt: تَنْوِين الخَفْض — الكَسْرَتَان
  by_shape: أَلِفَان مُضْجَعَتَان تَحْت الحَرْف
  mushaf_introduction: 'الحَرَكَتَان: تَرْكِيبًا أو تَتَابُعًا'
  unicode: ARABIC KASRATAN
kind: mark
category: dabt
parent: tanwin
origin: quranic
tier: core
status: draft
symbol: ـٍ
definition: الدلالة على التنوين المخفوض. وتركيب الحركتين يدل على إظهار التنوين، وتتابعهما
  مع تشديد التالي على الإدغام الكامل، ودونه على الإدغام الناقص أو الإخفاء
definition_en: Marks the in tanwin. Stacked marks signal izhar; staggered marks with a shaddah
  on the next letter signal complete idgham, and without one, incomplete idgham or ikhfa.
purpose: تستخدم قيمةً من قيم التنوين، ليقرأ منها نطق آخر الاسم وحكمه بدل قراءة صورة الشكل.
purpose_en: Used as a value of tanwin, so that the pronunciation of the noun's ending and
  its ruling are read from it rather than from the shape of the mark.
