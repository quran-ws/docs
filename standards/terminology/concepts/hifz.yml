concept: hifz
names:
  code: hifz
  display: Hifz
  arabic:
    vocalized: الحِفْظ
    singular: الحفظ
kind: concept
category: recitation
origin: quranic
tier: extended
status: draft
definition: >-
  استظهار القرآن كله أو بعضه عن ظهر قلب، على وجه يُتلى به من غير نظر في المصحف.
definition_en: >-
  Committing the Quran, in whole or in part, to memory, so that it is recited without looking
  in the mushaf.
purpose: >-
  يستخدم مجالًا لأدوات الاستظهار والمراجعة، التي تربط بالآية والصفحة والمتشابهات ما تتبعه
  من خطط وتكرار.
purpose_en: >-
  Used as the field of memorisation and revision tools, which attach their plans and repetitions
  to the ayah, the page and the mutashabihat.
boundaries:
- الحفظ حال القارئ لا صفة في النص، فلا يُوسم به النص، وإنما ما يُبنى له.
boundaries_en:
- >-
  Hifz is a state of the reader and not an attribute of the text; the text is not tagged with
  it, only what is built for it.
alternative_spellings:
- hifdh
- hifz_al_quran
english_glosses:
- memorising the Quran
- memorization
- memorisation
related:
- mutashabihat
- instructional_ayah_repetition
- tilawah
- khatmah
sources: []
