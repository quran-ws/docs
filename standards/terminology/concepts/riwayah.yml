plural: riwayahs
definition: ما ينسب إلى راو عن إمام القراءة؛ مثل رواية حفص عن عاصم.
definition_en: >
  What is attributed to a transmitter from an imam of a qiraah, such as the riwayah of
  Hafs from Asim.
purpose: تستخدم لتحديد الرواية التي يتبعها نص أو مصحف أو تسجيل أو dataset.
purpose_en: >
  Used to state which riwayah a text, a Mushaf, a recording or a dataset follows.
