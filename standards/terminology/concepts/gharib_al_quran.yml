concept: gharib_al_quran
names:
  code: gharib_al_quran
  display: Gharib al-Quran
  arabic:
    vocalized: غَرِيب القُرْآن
    singular: غريب القرآن
kind: content
category: quranic_sciences
origin: quranic
tier: core
status: draft
definition: >
  بيان معاني الألفاظ القرآنية التي خفي معناها على أكثر القراء، لقلة دورانها في
  الاستعمال أو لتغير دلالتها.
definition_en: >
  The explanation of Quranic words whose meaning is obscure to most readers, whether
  because they are rare in use or because their sense has shifted.
purpose: >
  يستخدم محتوى يربط بكلمة بعينها من الآية لا بالآية كلها، فيتميز عن التفسير
  الذي يفسر المعنى الكلي.
purpose_en: >
  Used as content attached to a particular word of an ayah rather than to the whole
  ayah, which is what sets it apart from tafsir and its explanation of the ayah's
  overall meaning.
boundaries:
  - غريب القرآن بيان لفظة، والتفسير بيان معنى الآية.
  - المعنى منسوب إلى كتاب بعينه، فقد يختلف بين المصادر.
boundaries_en:
  - >-
    Gharib al-Quran explains a word; tafsir explains the meaning of an ayah.
  - >-
    The meaning is attributed to a particular book, so it may differ between sources.
alternative_spellings:
  - gharib
  - word_meaning
english_glosses:
  - Word Meanings
related:
  - word
  - tafsir
  - ayah
sources: []
