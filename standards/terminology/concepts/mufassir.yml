plural: mufassirs
definition: >
  من نسب إليه تفسير للقرآن، تأليفًا أو رواية.
purpose: >
  يستخدم لنسبة التفسير إلى صاحبه، فيتميز صاحب القول عن الكتاب الذي نقل فيه وعن
  محققه وناشره.
boundaries:
  - المفسر صاحب القول، وقد ينقل قوله في كتاب لغيره.
