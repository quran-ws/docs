concept: sabab_al_waqf
names:
  code: sabab_al_waqf
  display: Sabab al-Waqf
  arabic:
    vocalized: سَبَب الوَقْف
    singular: سبب الوقف
kind: classification
category: waqf
origin: quranic
tier: extended
status: draft
definition: >-
  تقسيم الوقف باعتبار ما دعا القارئ إليه: اضطرار، أو اختبار، أو انتظار، أو اختيار.
definition_en: >-
  The division of waqf by what moved the reader to it: necessity, testing, waiting, or choice.
purpose: >-
  يستخدم تصنيفًا لموضع الوقف الواقع في تلاوة أو تسجيل، فيُعلم أعن قصد وقع أم عن عارض؛ وهو
  غير حكم الموضع نفسه وغير علامته.
purpose_en: >-
  Used as a classification of a stop that occurred in a tilawah or a recording, so that it
  is known whether it was deliberate or incidental; it is neither the ruling of the place
  nor its mark.
boundaries:
- >-
  سبب الوقف صفة في الوقف الواقع، وحكم الوقف صفة في الموضع، وعلامة الوقف ما رُسم في المصحف.
boundaries_en:
- >-
  The cause of a stop belongs to the stop that occurred; the waqf ruling belongs to the place;
  the waqf mark is what the mushaf draws.
alternative_spellings:
- waqf_cause
- aqsam_al_waqf
- waqf_by_cause
english_glosses:
- cause of the stop
related:
