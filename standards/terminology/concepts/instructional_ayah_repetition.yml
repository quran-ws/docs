concept: instructional_ayah_repetition
names:
  code: instructional_ayah_repetition
  display: Instructional Ayah Repetition
  arabic:
    vocalized: تَكْرَار الآيَات
    singular: تكرار الآيات
kind: concept
category: recitation_style
origin: standard
tier: core
status: draft
definition: إعادة آية أو جزء منها مرة أو مرات وفق نمط تعليمي يساعد على التلقي والحفظ.
definition_en: >
  Repeating an ayah, or part of one, once or several times in a teaching pattern that
  helps the learner take it in and memorise it.
purpose: يستخدم لوصف ميزة مستقلة في التسجيل التعليمي بدل جعلها جزءًا ضمنيًا من `muallim`.
purpose_en: >
  Used to describe a feature of a teaching recording in its own right, rather than
  leaving it implied inside `muallim`.
related:
  - muallim
  - recitation_style
