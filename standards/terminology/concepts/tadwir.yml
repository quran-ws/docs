definition: التدوير هو القراءة بسرعة متوسطة بين التحقيق والحدر مع المحافظة على الأحكام.
definition_en: >
  Reciting at a middle speed between tahqiq and hadr, while keeping the rules.
purpose: >
  نستخدم التدوير قيمة من قيم مراتب القراءة، نوسم بها التسجيل أو جلسة التعليم ونصفي
  بها.
purpose_en: >
  Used as a value of recitation pace, so that a recording or a teaching session is
  tagged by its pace and filtered by it.
