concept: harf_al_mana
names:
  code: harf_al_mana
  display: Harf al-Mana
  arabic:
    vocalized: حَرْف المَعْنَى
    singular: حرف المعنى
kind: classification_value
category: linguistics
parent: part_of_speech
origin: quranic
tier: core
status: draft
definition: >
  ما دل على معنى في غيره، كحروف الجر والعطف والنفي والاستفهام.
definition_en: >
  A particle: a word with no meaning of its own that gives meaning to the words around
  it, such as prepositions and the particles of conjunction, negation and interrogation.
purpose: يستخدم قيمةً من قيم قسم الكلمة، وتحته تندرج وسوم الحروف التفصيلية في مدونات الصرف القرآني.
purpose_en: Used as a value of part of speech, and the detailed particle tags of Quranic morphology corpora fall under it.
boundaries:
  - حرف المعنى قسم من أقسام الكلمة، وحرف المبنى — وهو `letter` — وحدة من النص
    المكتوب.
boundaries_en:
  - >-
    Harf al-mana is a part of speech; the written letter — `letter` — is a unit of the
    written text.
english_glosses:
  - Particle
related:
  - part_of_speech
  - letter
sources: []
note: >
  يسمى بالاسم الكامل لأن `harf` وحده اسم الحرف المبنى، وهو وحدة من وحدات الكتابة لا قسم من
  أقسام الكلمة؛ والقرار في سجل القرارات.
note_en: >
  It takes the full name because `harf` alone is the name of the written letter, a unit of
  writing and not a part of speech; the decision is in the decision record.
