concept: sifat_al_huruf
names:
  code: sifat_al_huruf
  display: Sifat al-Huruf
  arabic:
    vocalized: صِفَات الحُرُوف
    singular: صفات الحروف
kind: concept
category: tajwid
origin: quranic
tier: extended
status: draft
definition: >-
  كيفيات تعرض للحرف عند النطق به فتميزه عن مشاركه في المخرج؛ منها ما له ضد كالهمس والجهر والشدة
  والرخاوة، ومنها ما لا ضد له كالصفير والقلقلة.
definition_en: >-
  Manners that attend a letter as it is pronounced and distinguish it from a letter sharing
  its point of articulation; some have an opposite, such as hams and jahr, shiddah and rakhawah,
  and some have none, such as safir and qalqalah.
purpose: تستخدم في التعليم وتحليل النطق، ولتقرير التجانس والتقارب بين الحرفين.
purpose_en: >-
  Used in instruction and in the analysis of pronunciation, and to settle whether two letters
  are mutajanisan or mutaqariban.
boundaries:
- >-
  الصفة ما يُعرض للحرف في مخرجه، والتفخيم والترقيق أثر يترتب على بعض الصفات.
boundaries_en:
- >-
  An attribute is what attends the letter at its point of articulation; tafkhim and tarqiq
  are an effect that follows from some attributes.
alternative_spellings:
- sifat
- sifaat
- sifat_al_hurouf
- sifaat_al_huroof
english_glosses:
- attributes of the letters
related:
- makhraj
- qalqalah
- tafkhim
- tarqiq
- alaqat_al_harfayn
