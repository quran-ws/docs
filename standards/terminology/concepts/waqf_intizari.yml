concept: waqf_intizari
names:
  code: waqf_intizari
  display: Waqf Intizari
  arabic:
    vocalized: الوَقْف الاِنْتِظَارِيّ
    singular: الوقف الانتظاري
kind: classification_value
category: waqf
parent: sabab_al_waqf
origin: quranic
tier: extended
status: draft
definition: >-
  ما يقع على الكلمة التي فيها خلاف بين القراءات، ليستوفي القارئ أوجهها عند جمع القراءات.
definition_en: >-
  A stop made on a word the qiraat differ on, so that the reader covers its wajhs when gathering
  the readings.
purpose: >-
  يستخدم قيمةً من قيم سبب الوقف، فيُوسم به الوقف الواقع في التلاوة عند تحليلها أو تعليمها.
purpose_en: >-
  Used as a value of the cause of the stop, tagging a stop that occurred in a tilawah when
  it is analysed or taught.
alternative_spellings:
- intizari
- waqf_intizary
- waqf_intidhari
related:
- sabab_al_waqf
- waqf
