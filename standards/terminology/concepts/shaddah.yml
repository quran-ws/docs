concept: shaddah
names:
  code: shaddah
  display: Shaddah
  arabic:
    vocalized: الشَّدَّة
    singular: الشدة
  dabt: الشَّدَّة — رَأْس الشِّين (من «شَدِيد»)
  by_shape: رَأْس شِين بِلَا نُقَط
  mushaf_introduction: الشَّدَّة الدَّالَّة على الإِدْغَام
  unicode: ARABIC SHADDA
kind: mark
category: dabt
parent: harakah
origin: quranic
tier: core
status: draft
symbol: ـّ
definition: الشدة علامة تدل على تشديد الحرف، أي إدغام الأول الساكن في الثاني المتحرك حتى ينطقا
  حرفًا واحدًا مشددًا.
definition_en: 'Marks a doubled letter: the first, vowelless, is merged into the second and
  the two are pronounced as one stressed letter.'
purpose: نستخدمها قيمة من قيم الحركة، فنقرأ منها نطق الحرف في التحليل والعرض والتعليم بدلًا
  من قراءة صورة الشكل.
purpose_en: Used as a value of harakah, so that a letter's pronunciation is read from it in
  analysis, rendering and teaching rather than from the shape of the mark.
alternative_spellings:
- shadda
- tashdeed
- tashdid
related:
- harakah
- idgham
