concept: waqf
names:
  code: waqf
  display: Waqf
  arabic:
    vocalized: الوَقْف
    singular: الوقف
kind: concept
category: waqf
origin: quranic
tier: core
status: draft
definition: الوقف هو قطع القراءة عند موضع من النص وفق أحكام الوقف والابتداء.
definition_en: >
  Stopping the recitation at a place in the text according to the rules of stopping and
  starting.
purpose: >
  نستخدم الوقف مفهومًا عامًا لقطع القراءة، أما `waqf_mark` فتمثل العلامات المطبوعة
  التي ترشد إليه.
purpose_en: >
  Represents the general concept of stopping, while `waqf_mark` represents the printed
  signs that point to it.
