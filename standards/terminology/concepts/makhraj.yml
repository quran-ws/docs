concept: makhraj
names:
  code: makhraj
  display: Makhraj
  arabic:
    vocalized: المَخْرَج
    singular: المخرج
    plural: مخارج
kind: concept
category: tajwid
origin: quranic
tier: extended
status: draft
plural: makhrajs
definition: >-
  موضع خروج الحرف الذي يتميز به عن غيره، من الجوف أو الحلق أو اللسان أو الشفتين أو الخيشوم.
definition_en: >-
  The place a letter issues from and is distinguished by: the oral cavity, the throat, the
  tongue, the lips or the nasal cavity.
purpose: >-
  يستخدم في التعليم وتحليل النطق، ولتقرير علاقة الحرفين المتجاورين التي يُبنى عليها الإدغام.
purpose_en: >-
  Used in instruction and in the analysis of pronunciation, and to settle the relation between
  two adjacent letters that idgham is built on.
alternative_spellings:
- makhraj_al_harf
- makharij
- makhaarij
english_glosses:
- point of articulation
related:
- sifat_al_huruf
- alaqat_al_harfayn
- letter
