  display: Noun
  arabic:
    vocalized: الاِسْم
    singular: الاسم
kind: classification_value
category: linguistics
parent: part_of_speech
origin: borrowed
tier: core
status: draft
definition: >
  الاسم هو ما دل على معنى في نفسه غير مقترن بزمان، وتدخل فيه الأسماء والصفات والضمائر وأسماء
  الإشارة والموصولات.
definition_en: >
  A noun in the Arabic sense: a word whose meaning is not tied to a time. Nouns,
  adjectives, pronouns, demonstratives and relatives are all nouns.
purpose: >
  نستخدمه قيمة من قيم قسم الكلمة، وتندرج تحته الوسوم التفصيلية التي تستعملها مدونات الصرف
  القرآني.
purpose_en: >
  Used as a value of part of speech, and the detailed tags that Quranic morphology
  corpora use fall under it.
