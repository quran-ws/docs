note: كان `alamat_al_tahzib` مدخلًا مستقلًا يعرف الشيء نفسه، ثم دُمج في هذا المدخل.
note_en: '`alamat_al_tahzib` was a separate entry defining the same thing; it was merged into
  this one.'
