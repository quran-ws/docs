  display: Division Mark
  arabic:
    vocalized: عَلَامَة التَّقْسِيم
    singular: علامة التقسيم
  dabt: عَلَامَة التَّحْزِيب
  by_shape: نَجْمَة مُثَمَّنَة
  mushaf_introduction: عَلَامَة بِدَايَة الأَجْزَاء والأَحْزَاب وأَنْصَافِها وأَرْبَاعِها
  unicode: ARABIC START OF RUB EL HIZB
kind: mark
category: dabt
parent: mushaf_mark
origin: quranic
tier: core
status: draft
symbol: نَجْمَة
definition: علامة التقسيم علامة تدل على بداية الأجزاء والأحزاب وأنصافها وأرباعها.
definition_en: Marks the start of a juz, a hizb, or a half or quarter of one.
purpose: نستخدمها علامة من علامات المصحف، فنعرف بها موضعها ودلالتها في العرض والتحليل.
purpose_en: Used as a mark of the mushaf, so that rendering and analysis know where it sits
  and what it points to.
boundaries:
- علامة التقسيم رسم في المصحف، والجزء والحزب وأرباعه أقسام من النص تدل عليها.
boundaries_en:
- The division mark is a sign in the mushaf; the juz, the hizb and its quarters are divisions
  of the text it points to.
