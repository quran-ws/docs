concept: qalqalah
names:
  code: qalqalah
  display: Qalqalah
  arabic:
    vocalized: القَلْقَلَة
    singular: القلقلة
kind: classification_value
category: tajwid
parent: hukm_al_tajwid
origin: quranic
tier: core
status: draft
definition: >-
  اضطراب في صوت الحرف الساكن عند النطق به حتى تُسمع له نبرة قوية، في حروف «قطب جد»، ويقوى
  بحسب موضع الحرف من الكلمة والوقف عليه.
definition_en: >-
  A disturbance in the sound of a vowelless letter as it is pronounced, so that a strong beat
  is heard, in the letters of «قطب جد»; it grows stronger by the letter's place in the word
  and by stopping on it.
purpose: >-
  يستخدم قيمةً من قيم حكم التجويد، فيوسم به موضع النص في التحليل والتلوين والتعليم، وتتفرع
  تحته أنواعه في سجل الأحكام.
purpose_en: >-
  Used as a value of the tajwid ruling, so that a place in the text is tagged with it in analysis,
  colouring and instruction, and its kinds branch under it in the registry of rulings.
boundaries:
- >-
  القلقلة صفة من صفات الحروف التي لا ضد لها، وتُعد حكمًا حين يُوسم بها الموضع الذي تظهر فيه.
boundaries_en:
- >-
  Qalqalah is one of the attributes of the letters that have no opposite; it counts as a ruling
  when the place where it appears is tagged with it.
alternative_spellings:
- qalqala
- qalqalah_sughra
- qalqalah_kubra
- qalqalh
english_glosses:
