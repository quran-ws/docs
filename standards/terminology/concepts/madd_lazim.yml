concept: madd_lazim
names:
  code: madd_lazim
  display: Madd Lazim
  arabic:
    vocalized: المَدّ اللَّازِم
    singular: المد اللازم
kind: classification_value
category: tajwid
parent: madd
origin: quranic
tier: core
status: draft
definition: >-
  المد اللازم مد فرعي سببه سكون أصلي ثابت في الوصل والوقف بعد حرف المد، ويقع في كلمة أو في حرف
  من فواتح السور. ويكون مثقلًا بالإدغام أو مخففًا، ومقداره 6 حركات.
definition_en: >-
  A secondary madd caused by an original sukun, fixed in continuing and in stopping, after
  the letter of madd, in a word or in a letter of the surah openings, whether heavy with idgham
  or light; its length is 6 counts.
purpose: >-
  نستخدمه قيمة من قيم المد، فنوسم به موضع النص مع مقداره، ونقرأ منه ما يختلف باختلاف الطريق في
  وصف التسجيل والمصحف.
purpose_en: >-
  Used as a value of madd, so that a place in the text is tagged with it and with its length,
  and what differs by tariq is read from it in describing a recording or a mushaf.
alternative_spellings:
