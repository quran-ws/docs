concept: letter
names:
  code: letter
  display: Letter
  arabic:
    vocalized: الحَرْف
    singular: الحرف
kind: unit
category: text
origin: borrowed
tier: core
status: draft
plural: letters
definition: حرف هجائي بوصفه وحدة لغوية من وحدات الكتابة.
definition_en: >
  A letter of the alphabet as a linguistic unit of writing.
purpose: يستخدم للبيانات التي تتعامل مع الحروف اللغوية، دون الخلط بينها وبين التمثيلات الرقمية
  أو البصرية.
purpose_en: >
  Used for data that deals with linguistic letters, without confusing them with their
  digital or visual representations.
boundaries:
  - الحرف وحدة لغوية، والمحرف وحدة ترميز؛ فالحرف الواحد قد يكتب بمحرف أو أكثر.
  - الحرف وحدة من الكتابة، وحرف المعنى قسم من أقسام الكلمة.
boundaries_en:
  - >-
    A letter is a linguistic unit; a character is a unit of encoding, and one letter may
    be written with one character or more.
  - >-
    A letter is a unit of writing; harf al-mana is a part of speech.
alternative_spellings:
- harf
related:
  - character
  - glyph
  - harf_al_mana
sources:
  - id: quranpedia_tajweed
    ref: "5"
    url: https://tajweed.quranpedia.net/term/show/5
