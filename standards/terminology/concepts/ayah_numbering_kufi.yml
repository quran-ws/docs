concept: ayah_numbering_kufi
names:
  code: kufi
  display: Kufi Numbering
  arabic:
    vocalized: العَدّ الكُوفِيّ
    singular: العد الكوفي
kind: classification_value
category: ayah_numbering
parent: ayah_numbering_system
origin: quranic
tier: core
status: draft
definition: >
  العد الكوفي هو نظام عد الآي المروي عن حمزة الزيات عن ابن أبي ليلى عن أبي عبد الرحمن السلمي عن
  علي بن أبي طالب، وهو العد الذي تتبعه أكثر المصاحف المطبوعة اليوم.
definition_en: >
  The Kufan numbering system, transmitted from Hamzah al-Zayyat from Ibn Abi Layla from
  Abu Abd al-Rahman al-Sulami from Ali ibn Abi Talib. It is the numbering most printed
  mushafs follow today.
purpose: >
  نستخدمه قيمة من قيم نظام عد الآي. وبه يبين المصحف أو `dataset` النظام الذي تستند إليه أرقام
  آياته وحدودها، وبه نقابل مواضع الآي بين الأنظمة.
purpose_en: >
  Used as a value of the ayah numbering system, so that a mushaf or dataset states which
  numbering its ayah numbers and boundaries follow, and positions can be mapped between
  systems.
alternative_spellings:
  - kufi_numbering
  - kufan
  - kufan_numbering
related:
  - ayah_numbering_system
  - ayah
  - equivalent_ayah
note: >
  الاسم البرمجي `kufi` وحده، لأن اسم القيمة فريد داخل تصنيفها لا في القاموس كله (§14)؛
  فالعمود يحمل قيم تصنيف واحد، ولا يلتبس `makki` هنا بـ`makki` في `revelation_classification`.
  أما معرّف المدخل فهو `ayah_numbering_kufi`، اسم الأب مع الاسم البرمجي، حتى يكون للمدخلين
  المشتركين في الاسم عنوانان مختلفان. ولا يشتق الاسم من «العَدّ» لأن اشتقاقه يعطي `add` وهو
  فعل إنجليزي. والسبب مسجل في سجل القرارات.
note_en: >
  The code is `kufi` alone, because a value's name is unique within its classification,
  not across the dictionary (§14): a column holds one classification's values, so `makki`
  here is never confused with `makki` in `revelation_classification`. The entry's id is
  `ayah_numbering_kufi`, the parent's name plus the code, so that two entries sharing a
  name have different addresses. The code is not derived from «العَدّ» because that gives
  `add`, an English verb. The reasoning is in the decision record.
sources:
  - id: bayan_dani
    ref: "1/80"
