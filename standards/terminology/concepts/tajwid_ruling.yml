concept: tajwid_ruling
names:
  code: tajwid_ruling
  display: Tajwid Ruling
  arabic:
    vocalized: حُكْم التَّجْوِيد
    singular: حكم التجويد
    plural: أَحْكَام التَّجْوِيد
kind: classification
category: tajwid
registry: tajwid_rules
origin: quranic
tier: core
status: draft
plural: tajwid_rulings
definition: >-
  حكم التجويد هو ما تقرره قواعد التجويد في أداء الحرف في موضع بعينه من النص، عند حرف
  يليه أو عند سكون أو همز، مثل الإظهار والإدغام والإقلاب والإخفاء والمد والقلقلة
  والتفخيم والترقيق.
definition_en: >-
  What is due in delivering a letter before the letter that follows it, or at a sukun or a
  hamzah: izhar, idgham, iqlab, ikhfa, madd, qalqalah, tafkhim or tarqiq, as the rules of
  tajwid settle it at a given place in the text.
purpose: >-
  نستخدم حكم التجويد أبًا لأحكام التجويد ووعاء لسجلها. وتنسب إليه مواضع النص التي يقع
  فيها حكم، ويشار إلى الحكم بعينه بصف من السجل بدل اسم حر يختلف من محرك إلى محرك.
purpose_en: >-
  Used as the parent of the rulings of tajwid and the holder of their registry, so that the
  places in the text where a ruling falls are attributed to it, and a particular ruling is
  named by a row of the registry rather than by a free name that differs from one engine to
  another.
boundaries:
  - الحكم هو ما يقع في الموضع، والتجويد هو العلم الذي يقرره.
  - الحكم غير القاعدة، فالقاعدة هي شرط الحكم، والحكم هو أثر القاعدة في الموضع.
boundaries_en:
- >-
  The ruling is what falls at the place; tajwid is the discipline that settles it.
- >-
  A ruling is not a rule: the rule is the condition, and the ruling is its effect at the place.
