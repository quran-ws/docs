concept: waqf_kafi
names:
  code: waqf_kafi
  display: Waqf Kafi
  arabic:
    vocalized: الوَقْف الكَافِي
    singular: الوقف الكافي
kind: classification_value
category: waqf
parent: waqf_ruling
origin: quranic
tier: core
status: draft
definition: الوقف الكافي هو الوقف على ما تم معناه وتعلق بما بعده في المعنى دون اللفظ.
definition_en: >
  A stop whose meaning is complete but which is connected to what follows it in meaning,
  not in wording.
purpose: نستخدم الوقف الكافي قيمة من قيم حكم الوقف، ونوسم به الموضع في التعليم والتحليل.
purpose_en: Used as a value of the waqf ruling, so that a place is tagged with it in teaching and analysis.
