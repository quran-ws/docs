concept: ayah_numbering_dimashqi
names:
  code: dimashqi
  display: Dimashqi Numbering
  display_evidence: >
    GitHub phrase search: dimashqi numbering 0 vs shami numbering 0. No form is established, so the display follows the code; `shami` stays an alias.
  arabic:
    vocalized: العَدّ الدِّمَشْقِيّ
    singular: العد الدمشقي
kind: classification_value
category: ayah_numbering
parent: ayah_numbering_system
origin: quranic
tier: core
status: draft
definition: >
  العد الدمشقي هو نظام عد أهل الشام، المروي عن يحيى بن الحارث الذماري عن ابن عامر، ويسمى العد
  الشامي.
definition_en: >
  The Damascene numbering system, transmitted from Yahya ibn al-Harith al-Dhimari from
  Ibn Amir; also called the Shami numbering.
purpose: >
  نستخدمه قيمة من قيم نظام عد الآي. وبه يبين المصحف أو `dataset` النظام الذي تستند إليه أرقام
  آياته وحدودها، وبه نقابل مواضع الآي بين الأنظمة.
purpose_en: >
  Used as a value of the ayah numbering system, so that a mushaf or dataset states which
  numbering its ayah numbers and boundaries follow, and positions can be mapped between
  systems.
alternative_spellings:
  - dimashqi_numbering
  - shami
  - shami_numbering
  - damascene
  - ayah_numbering_shami
related:
  - ayah_numbering_system
  - ayah
  - equivalent_ayah
note: >
  الاسم البرمجي `dimashqi` وحده، لأن اسم القيمة فريد داخل تصنيفها لا في القاموس كله (§14)؛
  فالعمود يحمل قيم تصنيف واحد، ولا يلتبس `makki` هنا بـ`makki` في `revelation_classification`.
  أما معرّف المدخل فهو `ayah_numbering_dimashqi`، اسم الأب مع الاسم البرمجي، حتى يكون للمدخلين
  المشتركين في الاسم عنوانان مختلفان. ولا يشتق الاسم من «العَدّ» لأن اشتقاقه يعطي `add` وهو
  فعل إنجليزي. والسبب مسجل في سجل القرارات.
note_en: >
  The code is `dimashqi` alone, because a value's name is unique within its classification,
  not across the dictionary (§14): a column holds one classification's values, so `makki`
  here is never confused with `makki` in `revelation_classification`. The entry's id is
  `ayah_numbering_dimashqi`, the parent's name plus the code, so that two entries sharing a
  name have different addresses. The code is not derived from «العَدّ» because that gives
  `add`, an English verb. The reasoning is in the decision record.
sources:
  - id: bayan_dani
    ref: "1/82"
