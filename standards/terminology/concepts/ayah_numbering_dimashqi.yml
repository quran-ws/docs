concept: ayah_numbering_dimashqi
names:
  code: ayah_numbering_dimashqi
  display: Dimashqi Numbering
  arabic:
    vocalized: العَدّ الدِّمَشْقِي
    singular: العد الدمشقي
kind: classification_value
category: ayah_numbering
parent: ayah_numbering_system
origin: quranic
tier: core
status: draft
definition: >
  عد أهل الشام، المروي عن يحيى بن الحارث الذماري عن ابن عامر، ويسمى العد الشامي.
purpose: >
  يستخدم قيمةً من قيم نظام عد الآي، فيعرف به ما تستند إليه أرقام الآيات وحدودها
  في مصحف أو dataset، وتقابل به مواضع الآي بين الأنظمة.
alternative_spellings:
  - dimashqi_numbering
  - shami
  - shami_numbering
  - damascene_numbering
related:
  - ayah_numbering_system
  - ayah
  - equivalent_ayah
note: >
  الاسم البرمجي هنا اسم الأصل وما يميز القيمة، لا اشتقاق من الاسم العربي؛
  فاشتقاق «العَدّ» يعطي `add` وهو فعل إنجليزي، و`makki` مأخوذ قيمةً من قيم
  `revelation_classification`. والوجه في ذلك مسجل في سجل القرارات.
sources: []
