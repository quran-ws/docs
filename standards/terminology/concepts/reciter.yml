concept: reciter
names:
  code: reciter
  display: Reciter
  arabic:
    vocalized: القَارِئ
    singular: القارئ
kind: role
category: recitation
origin: borrowed
tier: core
status: draft
plural: reciters
definition: الشخص الذي يؤدي تلاوة القرآن.
definition_en: >
  The person who performs a recitation of the Quran.
purpose: >
  يستخدم لربط التسجيلات الصوتية بمؤديها.
purpose_en: >
  Used to tie audio recordings to their performer.
boundaries:
  - القارئ مؤدي التلاوة في التسجيل، وليس إمام قراءة ولا راويًا.
boundaries_en:
  - >-
    A reciter performs the recitation in a recording; they are neither an imam of a
    qiraah nor a rawi.
alternative_spellings:
  - qari
  - qaari
related:
  - recitation
  - rawi
  - muqri
  - ayah_timing
