concept: tanwin_al_fath
names:
  code: tanwin_al_fath
  display: Tanwin al-Fath
  arabic:
    vocalized: تَنْوِين الفَتْح
  dabt: تَنْوِين النَّصْب — الفَتْحَتَان
  by_shape: أَلِفَان مُضْجَعَتَان فَوْق الحَرْف
  mushaf_introduction: 'الحَرَكَتَان: تَرْكِيباً أو تَتَابُعاً'
  unicode: ARABIC FATHATAN
kind: mark
category: dabt
parent: tanwin
origin: quranic
tier: core
status: draft
symbol: ـً
definition: الدَّلَالَة على التَّنْوِين المَنْصُوب. وتَرْكِيب الحَرَكَتَيْن يدلّ على إظْهَار
  التَّنْوِين، وتَتَابُعُهما مع تَشْدِيد التَّالِي على الإدْغَام الكَامِل، وبدونه على الإدْغَام
  النَّاقِص أو الإخْفَاء
definition_en: Marks the an tanwin. Stacked marks signal izhar; staggered marks with a shadda
  on the next letter signal complete idgham, and without one, incomplete idgham or ikhfa.
purpose: تستخدم قيمةً من قيم التنوين، ليقرأ منها نطق آخر الاسم وحكمه بدل قراءة صورة الشكل.
purpose_en: Used as a value of tanwin, so that the pronunciation of the noun's ending and
  its ruling are read from it rather than from the shape of the mark.
