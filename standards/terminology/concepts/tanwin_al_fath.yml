concept: tanwin_al_fath
names:
  code: tanwin_al_fath
  display: Tanwin al-Fath
  arabic:
    vocalized: تَنْوِين الفَتْح
    singular: تنوين الفتح
  dabt: تَنْوِين النَّصْب — الفَتْحَتَان
  by_shape: أَلِفَان مُضْجَعَتَان فَوْق الحَرْف
  mushaf_introduction: 'الحَرَكَتَان: تَرْكِيبًا أو تَتَابُعًا'
  unicode: ARABIC FATHATAN
kind: mark
category: dabt
parent: tanwin
origin: quranic
tier: core
status: draft
symbol: ـً
definition: تنوين الفتح علامة تدل على التنوين المنصوب. وتركيب الحركتين يدل على إظهار التنوين،
  وتتابعهما مع تشديد الحرف التالي يدل على الإدغام الكامل، وتتابعهما دون تشديد يدل على الإدغام
  الناقص أو الإخفاء.
definition_en: Marks the an tanwin. Stacked marks signal izhar; staggered marks with a shaddah
  on the next letter signal complete idgham, and without one, incomplete idgham or ikhfa.
purpose: نستخدمها قيمة من قيم التنوين، فنقرأ منها نطق آخر الاسم وحكمه بدلًا من قراءة صورة
  الشكل.
purpose_en: Used as a value of tanwin, so that the pronunciation of the noun's ending and
  its ruling are read from it rather than from the shape of the mark.
