concept: harf_muqatta
names:
  code: harf_muqatta
  display: Disjointed Letter
  arabic:
    vocalized: الحَرْف المُقَطَّع
    singular: الحرف المقطع
kind: concept
category: structure
origin: quranic
tier: core
status: draft
plural: harf_muqattas
definition: 'حروف هجائية افتتحت بها بعض السور، مثل: الم، والر، وحم، وكهيعص.'
definition_en: >
  Alphabetic letters that open certain surahs, such as Alif Lam Mim, Alif Lam Ra, Ha Mim
  and Kaf Ha Ya Ayn Sad.
purpose: تستخدم لتعريف هذه الفواتح وتمييزها وربطها بالسور ومواضعها النصية.
purpose_en: >
  Used to identify these openings, keep them distinct, and tie them to their surahs and
  their positions in the text.
english_glosses:
- Separated Letters
- Disjointed Letters
sources: []
