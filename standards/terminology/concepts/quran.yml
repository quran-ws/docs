concept: quran
names:
  code: quran
  display: Quran
  arabic:
    vocalized: القُرْآن
    singular: القرآن
kind: concept
category: core
origin: quranic
tier: core
status: draft
definition: >
  كلام الله المنزل على محمد صلى الله عليه وسلم والمتعبد بتلاوته، ويطلق على مجموعه وعلى
  بعضه بحسب السياق.
definition_en: >
  The speech of Allah revealed to Muhammad, peace be upon him, whose recitation is
  worship. The name covers the whole and, by context, any part of it.
purpose: يمثل المحتوى القرآني نفسه بصورة مستقلة عن مصحف أو تخطيط أو تنسيق أو تمثيل رقمي معين.
purpose_en: >
  Represents the Quranic content itself, independent of any particular mushaf, layout,
  formatting or digital representation.
boundaries:
  - القرآن هو الكلام نفسه، والمصحف وعاؤه المكتوب؛ فما يخص الصفحات والرسم والعلامات يخص المصحف لا القرآن.
boundaries_en:
  - >-
    The Quran is the speech itself; the mushaf is its written vessel. Pages, rasm and
    marks belong to the mushaf, not to the Quran.
alternative_spellings:
  - koran
  - qur'an
  - qur’an
  - quraan
  - al_quran
related:
  - mushaf
  - surah
  - ayah
sources:
  - id: qattan_mabahith
    ref: "1/15"
