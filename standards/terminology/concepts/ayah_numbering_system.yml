concept: ayah_numbering_system
names:
  code: ayah_numbering_system
  display: Ayah Numbering System
  arabic:
    vocalized: نِظَام عَدّ الآي
    singular: نظام عد الآي
kind: classification
category: ayah_numbering
registry: ayah_numbering
origin: standard
tier: core
status: draft
plural: ayah_numbering_systems
definition: نظام عد الآي هو النظام الذي يحدد حدود الآيات وأعدادها وأرقامها وبعض المسائل المتعلقة بالبسملة،
  وفق إحدى مدارس عد الآي.
definition_en: >
  A system that fixes the boundaries of the ayahs, their totals and their numbers, and
  certain questions about the basmalah, as transmitted by one of the schools of ayah
  counting.
purpose: >
  نستخدمه لتحديد النظام الذي تستند إليه أرقام الآيات وحدودها في مصحف أو `dataset` معين.
purpose_en: >
  Used to state which numbering system a mushaf's or a dataset's ayah numbers and
  boundaries follow.
alternative_spellings:
- ayah_counting_system
related:
  - ayah
  - equivalent_ayah
  - basmalah
  - ayah_count
  - ayah_numbering_kufi
  - ayah_numbering_basri
  - ayah_numbering_dimashqi
  - ayah_numbering_makki
  - ayah_numbering_madani_first
  - ayah_numbering_madani_last
