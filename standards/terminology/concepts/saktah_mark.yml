definition_en: 'Marks a saktah: a brief pause without taking a breath, then continuing.'
purpose: تستخدم قيمةً من علامات القراءة، لينبه بها القارئ إلى أداء خاص في موضعه.
purpose_en: Used as a value of the qiraah marks, so that the reader is alerted to a particular
  delivery at its place.
