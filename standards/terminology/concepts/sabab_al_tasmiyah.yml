concept: sabab_al_tasmiyah
names:
  code: sabab_al_tasmiyah
  display: Sabab al-Tasmiyah
  arabic:
    vocalized: سَبَب التَّسْمِيَة
    singular: سبب التسمية
kind: content
category: quranic_sciences
origin: quranic
tier: extended
status: draft
definition: >
  بيان العلة التي سميت بها السورة اسمها، وما ورد في ذلك من أثر أو وجه لغوي.
definition_en: >
  The statement of why a surah was given its name, and what has been transmitted about
  it by narration or on linguistic grounds.
purpose: >
  يستخدم محتوى يربط بالسورة، ويفرد عن سبب النزول لأنه يخص الاسم لا النزول،
  وكثير من السور لها أكثر من اسم فلها أكثر من سبب.
purpose_en: >
  Used as content attached to a surah. It is kept apart from the occasion of revelation
  because it concerns the name and not the revelation, and because many surahs have more
  than one name and so more than one reason.
boundaries:
  - سبب التسمية يخص اسم السورة، وسبب النزول يخص نزول الآية.
boundaries_en:
  - >-
    The reason for the name concerns the surah's name; the occasion of revelation
    concerns the revelation of an ayah.
alternative_spellings:
  - sabab_al_tasmiya
related:
  - surah
  - asbab_al_nuzul
sources:
  - id: itqan
    ref: "1/178"
