concept: lahn_jali
names:
  code: lahn_jali
  display: Lahn Jali
  arabic:
    vocalized: اللَّحْن الجَلِيّ
    singular: اللحن الجلي
kind: classification_value
category: tajwid
parent: lahn
origin: quranic
tier: extended
status: draft
definition: >-
  خطأ يطرأ على اللفظ فيخل بالمبنى أو المعنى، كإبدال حرف بحرف أو حركة بحركة، ويدركه العالم
  وغيره.
definition_en: >-
  An error in the wording that damages its form or its meaning, such as one letter put for
  another or one vowel for another; the learned and the unlearned alike notice it.
purpose: >-
  يستخدم قيمةً من قيم اللحن، فيُميز في تقارير التقويم الخطأ الذي يجب تصحيحه على كل قارئ.
purpose_en: >-
  Used as a value of lahn, so that assessment reports single out the error every reciter must
  correct.
alternative_spellings:
- lahn_jaliy
- lahn_jalee
- clear_error
english_glosses:
- plain error
related:
- lahn
- lahn_khafi
sources:
