  dabt: تَنْوِين النَّصْب — الفَتْحَتَان
  by_shape: أَلِفَان مُضْجَعَتَان فَوْق الحَرْف
  mushaf_introduction: 'الحَرَكَتَان: تَرْكِيباً أو تَتَابُعاً'
  unicode: ARABIC FATHATAN
kind: mark
category: dabt
parent: mushaf_mark
origin: quranic
tier: core
status: draft
symbol: ـً
definition: الدَّلَالَة على التَّنْوِين المَنْصُوب. وتَرْكِيب الحَرَكَتَيْن يدلّ على إظْهَار
  التَّنْوِين، وتَتَابُعُهما مع تَشْدِيد التَّالِي على الإدْغَام الكَامِل، وبدونه على الإدْغَام
  النَّاقِص أو الإخْفَاء
purpose: Marks the an tanwin. Stacked marks signal izhar; staggered marks with a shadda on
  the next letter signal complete idgham, and without one, incomplete idgham or ikhfa.
