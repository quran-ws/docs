concept: harakah
names:
  code: harakah
  display: Harakah
  arabic:
    vocalized: الحَرَكَة
    singular: الحركة
kind: classification
category: dabt
parent: mushaf_mark
origin: quranic
tier: core
status: draft
definition: >
  علامة تضبط حركة الحرف أو سكونه أو تشديده: الفتحة والضمة والكسرة والسكون والشدة.
definition_en: >
  A mark fixing a letter's vowel, its absence or its doubling: fathah, dammah, kasrah,
  sukun and shaddah.
purpose: تستخدم أبًا لعلامات الضبط التي تحدد نطق الحرف نفسه.
purpose_en: >
  Used as the parent of the dabt marks that determine how the letter itself is
  pronounced.
alternative_spellings:
  - haraka
  - harakat
english_glosses:
  - Vowel Mark
  - diacritics
