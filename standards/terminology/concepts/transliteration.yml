concept: transliteration
names:
  code: transliteration
  display: Transliteration
  arabic:
    vocalized: النَّقْل الحَرْفِيّ
    singular: النقل الحرفي
kind: content
category: translation
origin: borrowed
tier: core
status: draft
plural: transliterations
definition: النقل الحرفي هو تمثيل حروف نظام كتابي بحروف نظام آخر وفق قواعد محددة، دون ترجمة المعنى.
definition_en: >
  Representing the letters of one writing system with those of another by fixed rules,
  without translating the meaning.
purpose: نستخدم النقل الحرفي لتوفير تمثيل قابل للقراءة بنظام كتابي آخر أو للتحويل المنهجي بين أنظمة الكتابة.
purpose_en: >
  Used to give a readable representation in another writing system, or for systematic
  conversion between writing systems.
related:
  - translation
sources: []
