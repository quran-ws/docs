concept: asbab_al_nuzul
names:
  code: asbab_al_nuzul
  display: Asbab al-Nuzul
  arabic:
    vocalized: أَسْبَاب النُّزُول
    singular: أسباب النزول
kind: content
category: revelation
origin: quranic
tier: core
status: draft
definition: الحوادث أو الأسئلة التي نزلت آية أو آيات متحدثة عنها أو مبينة لحكم يتعلق بها.
definition_en: >
  The events or questions that an ayah, or several ayahs, was revealed to address or to
  rule on.
purpose: تستخدم لربط الآيات بالمرويات والمعلومات المتعلقة بسبب نزولها.
purpose_en: >
  Used to attach the narrations and the material about an ayah's occasion of revelation
  to the ayah itself.
alternative_spellings:
- asbab_al-nozool
- asbab_un-nuzul
related:
  - nuzul
  - ayah
  - sabab_al_tasmiyah
  - naskh
sources:
  - id: qattan_mabahith
    ref: "1/75"
  - id: itqan
    ref: "1/107"
