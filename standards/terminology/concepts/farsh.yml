concept: farsh
names:
  code: farsh
  display: Farsh
  arabic:
    vocalized: الفَرْش
    singular: الفرش
kind: concept
category: qiraat
origin: quranic
tier: extended
status: draft
definition: >-
  ما اختلف فيه القراء من الكلمات في مواضع بأعيانها من السور، لا يطرد الخلاف فيه على قاعدة،
  بل يُذكر كل موضع بنفسه مرتبًا على السور.
definition_en: >-
  The words the readers differ on at particular places in the surahs, where the difference
  follows no general rule but each place is named on its own, arranged by surah.
purpose: >-
  يستخدم لوسم فروق القراءات التي تُخزن كلمةً كلمةً بموضعها، مقابل الأصول التي تُخزن قاعدةً
  وتُطبق حيث تحقق شرطها.
purpose_en: >-
  Used to tag the differences between qiraat that are stored word by word at their place,
  as against the usul, which are stored as a rule and applied wherever their condition holds.
boundaries:
- الفرش والأصول قسما خلاف القراءات، والوجه ما يجوز داخل الرواية الواحدة.
boundaries_en:
- >-
  Farsh and usul are the two divisions of the differences between qiraat; a wajh is what is
  permitted within one riwayah.
alternative_spellings:
- farsh_al_huruf
- farshiyyah
- farshiyyat
english_glosses:
- word-specific differences
related:
- usul
- qiraah
- wajh
sources:
