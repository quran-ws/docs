concept: usul
names:
  code: usul
  display: Usul
  arabic:
    vocalized: الأُصُول
    singular: الأصول
kind: concept
category: qiraat
origin: quranic
tier: extended
status: draft
definition: >-
  القواعد المطردة في القراءة التي يجري عليها كل ما تحقق فيه شرطها، كالمد والهمز والإمالة والإدغام
  وهاء الكناية.
definition_en: >-
  The general rules of a reading that apply to everything meeting their condition, such as
  madd, hamzah, imalah, idgham and the pronoun haa.
purpose: >-
  تستخدم لوسم فروق القراءات التي تُخزن قاعدةً لا موضعًا، فتُطبق على النص حيث تحقق شرطها.
purpose_en: >-
  Used to tag the differences between qiraat that are stored as a rule rather than a place,
  and applied to the text wherever their condition holds.
boundaries:
- الأصول قواعد القراءة، والفرش مواضعها المعينة.
boundaries_en:
- Usul are the rules of a reading; farsh is its particular places.
alternative_spellings:
- usool
- usul_al_qiraah
- usul_al_qiraat
english_glosses:
- general rules
related:
- farsh
- qiraah
- madd
- imalah
