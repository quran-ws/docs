concept: font
names:
  code: font
  display: Font
  arabic:
    vocalized: الخَطّ
    singular: الخط
kind: concept
category: mushaf
origin: borrowed
tier: core
status: draft
plural: fonts
definition: >
  ملف يحمل مجموعة من الأشكال المرسومة (`glyphs`) وقواعد إخراجها، يعرض به نص المصحف.
definition_en: >
  A file carrying a set of glyphs and the rules for laying them out, used to render the
  text of a mushaf.
purpose: >
  يستخدم لتسجيل الخط الذي يعتمد عليه المصحف الرقمي، إذ لا يعرض نصه عرضًا صحيحًا إلا بخط
  بعينه في كثير من المصاحف، فترتبط به رموز الحروف وأشكالها ومواضع الأسطر.
purpose_en: >
  Used to record which font a digital mushaf depends on, since in many of them the text
  renders correctly in one font only, so letter codes, their shapes and line positions
  are tied to it.
boundaries:
  - الخط وسيلة عرض، والرسم صفة للنص المكتوب نفسه.
  - الشكل المرسوم (`glyph`) شكل داخل الخط، والحرف وحدة من النص.
boundaries_en:
  - >-
    A font is a means of display; the rasm is a property of the written text itself.
  - >-
    A glyph is a shape inside a font; a letter is a unit of the text.
related:
  - glyph
  - rasm
  - layout
  - line
sources: []
