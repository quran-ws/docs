concept: font
names:
  code: font
  display: Font
  arabic:
    vocalized: الخَطّ
    singular: الخط
kind: concept
category: mushaf
origin: borrowed
tier: core
status: draft
plural: fonts
definition: >
  ملف يحمل مجموعة من الـglyphs وقواعد إخراجها، يعرض به نص المصحف.
definition_en: >
  A file carrying a set of glyphs and the rules for laying them out, used to render the
  text of a Mushaf.
purpose: >
  يستخدم لأن نص المصحف لا يعرض عرضًا صحيحًا إلا بخط بعينه في كثير من المصاحف
  الرقمية، فترتبط به رموز الحروف وأشكالها ومواضع الأسطر.
purpose_en: >
  Used because in many digital Mushafs the text renders correctly only in one particular
  font, so letter codes, their shapes and line positions are tied to it.
boundaries:
  - الخط وسيلة عرض، والرسم صفة للنص المكتوب نفسه.
  - الـglyph شكل داخل الخط، والحرف وحدة من النص.
boundaries_en:
  - >-
    A font is a means of display; the rasm is a property of the written text itself.
  - >-
    A glyph is a shape inside a font; a letter is a unit of the text.
related:
  - glyph
  - rasm
  - layout
  - line
sources: []
