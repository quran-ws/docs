definition: الجزء واحد من 30 قسمًا في التقسيم المشهور للمصحف، والغرض من هذا التقسيم تيسير القراءة والختم.
definition_en: >
  One of the 30 parts of the well-known division of the mushaf, made to ease reading and
  completing it.
purpose: نستخدمه للتنقل وتنظيم القراءة والجداول والخطط المرتبطة بأجزاء القرآن.
purpose_en: >
  Used for navigation, for organising reading, and for the schedules and plans built on
  the parts of the Quran.
