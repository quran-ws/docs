concept: idgham
names:
  code: idgham
  display: Idgham
  arabic:
    vocalized: الإِدْغَام
    singular: الإدغام
kind: classification_value
category: tajwid
parent: tajwid_ruling
origin: quranic
tier: core
status: draft
definition: >-
  الإدغام إدخال حرف ساكن في حرف متحرك بعده بحيث يصيران حرفًا واحدًا مشددًا. ويكون الإدغام كاملًا
  أو ناقصًا، وبغنة أو بغير غنة.
definition_en: >-
  Merging a vowelless letter into a vowelled letter after it so that the two become one doubled
  letter, whether the merging is complete or partial, with ghunnah or without it.
purpose: >-
  نستخدمه قيمة من قيم حكم التجويد، فنوسم به موضع النص في التحليل والتلوين والتعليم، وتتفرع تحته
  أنواعه في سجل الأحكام.
purpose_en: >-
  Used as a value of the tajwid ruling, so that a place in the text is tagged with it in analysis,
  colouring and instruction, and its kinds branch under it in the registry of rulings.
boundaries:
- >-
  الإدغام حكم، أما التماثل والتجانس والتقارب فعلاقة بين الحرفين يقع الإدغام بسببها.
boundaries_en:
- >-
  Idgham is a ruling; mutamathilan, mutajanisan and mutaqariban are the relation between the
  two letters because of which it falls.
alternative_spellings:
