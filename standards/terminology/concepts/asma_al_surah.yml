concept: asma_al_surah
names:
  code: asma_al_surah
  display: Asma al-Surah
  arabic:
    vocalized: أَسْمَاء السُّورَة
    singular: أسماء السورة
kind: content
category: quranic_sciences
origin: quranic
tier: core
status: draft
definition: >
  ما سميت به السورة من أسماء، وأكثر السور لها أكثر من اسم، منها ما ثبت بالأثر
  ومنها ما جرى به الاصطلاح.
definition_en: >
  The names a surah is known by. Most surahs carry more than one: some established by
  narration, others settled by usage.
purpose: >
  يستخدم لحفظ كل ما تعرف به السورة من أسماء، لأن المصاحف تختلف في الاسم المثبت، والبحث
  يحتاج أن يجد السورة بأي أسمائها.
purpose_en: >
  Used to hold every name a surah is known by, because mushafs differ over the name they
  print and search must find a surah by any of them.
boundaries:
  - اسم السورة شيء، وسبب تسميتها به شيء آخر.
  - أسماء السورة غير أسماء القرآن نفسه.
boundaries_en:
  - >-
    The name of a surah is one thing; the reason it was given that name (sabab
    al-tasmiyah) is another.
  - >-
    The names of a surah are not the names of the Quran itself.
alternative_spellings:
  - asmaa_al_surah
english_glosses:
  - Surah Names
related:
  - surah
  - sabab_al_tasmiyah
sources:
  - id: itqan
    ref: "1/178"
