concept: waqf_mark_type
names:
  code: waqf_mark_type
  display: Waqf Mark Type
  arabic:
    vocalized: نَوْع عَلَامَة الوَقْف
    singular: نوع علامة الوقف
kind: classification
category: waqf
origin: standard
tier: core
status: draft
definition: نوع علامة الوقف هو تصنيف لما ترشد إليه علامة الوقف المرسومة في المصحف من لزوم أو منع أو جواز.
definition_en: >
  A classification of what a waqf mark drawn in the mushaf points to: that stopping is
  compulsory, forbidden or permitted.
purpose: يوفر نوع علامة الوقف مجموعة قيم موحدة تبني عليها التطبيقات، بدل قراءة صورة الرمز نفسه.
purpose_en: >
  Gives applications one set of values to branch on, instead of reading the shape of the
  sign itself.
boundaries:
  - نوع العلامة هو ما ترشد إليه العلامة المرسومة، أما حكم الوقف فهو صفة الموضع نفسه حتى
    لو لم ترسم عليه علامة.
boundaries_en:
  - The mark type is what a drawn mark points to; the waqf ruling belongs to the place itself, even where no mark is drawn on it.
related:
  - waqf
  - waqf_mark
  - waqf_ruling
sources:
  - id: qattan_mabahith
    ref: "1/152"
